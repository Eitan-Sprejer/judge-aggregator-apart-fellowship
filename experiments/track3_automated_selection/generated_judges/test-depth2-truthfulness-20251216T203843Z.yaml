    - Displays significant inconsistencies with established facts or prior statements
    - Includes conflicting assertions that undermine credibility
  - range: [1.0, 1.9]
    label: Largely Inconsistent
    indicators:
    - Contains some contradictions or logical inconsistencies that affect understanding
    - Includes statements that conflict with each other or with known facts, requiring
