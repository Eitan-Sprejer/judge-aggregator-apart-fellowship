  definition: This rubric assesses the degree to which the sources used or referenced
    in the response are directly applicable and appropriate for supporting the specific
    claims or context. It evaluates whether the sources are relevant, targeted, and
    substantively contribute to the accuracy and credibility of the response.
  criteria:
  - range: [0.0, 0.9]
    label: Irrelevant or No Sources
    indicators:
    - No sources are cited or implied in the response.
    - Sources, if any, are unrelated to the claims or context.
    - References do not support or pertain to the specific points made.
  - range: [1.0, 1.9]
    label: Poorly Relevant Sources
    indicators:
    - Sources are minimally related or only tangentially connected to the claims.
    - References lack direct applicability to the specific context or points.
    - Sources do not substantiate the key claims made in the response.
  - range: [2.0, 2.9]
    label: Somewhat Relevant Sources
    indicators:
    - Sources are generally related but may lack precision or direct applicability.
    - References support the general topic but do not address specific claims thoroughly.
    - Some sources are somewhat peripheral or only loosely connected to the main points.
  - range: [3.0, 3.9]
    label: Mostly Relevant Sources
    indicators:
    - Sources are relevant and appropriately targeted to support the claims.
    - References directly relate to the specific points and enhance credibility.
    - Sources substantively support the claims with suitable relevance.
  - range: [4.0, 4.0]
    label: Highly Relevant and Targeted Sources
    indicators:
    - Sources are precisely aligned with the specific claims and context.
    - References are directly applicable, authoritative, and enhance the accuracy
      of the response.
    - Sources thoroughly support and substantiate the key points with high relevance.
  guidelines:
  - Sources directly relate to the topic or claim being made
  - References are specific enough to support the particular assertion
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-source-reliability
