    - Addresses the main aspects of current understanding with minor lapses
    - Includes generally relevant information with some room for improvement in recency
  - range: [3.0, 3.9]
    label: Current and Appropriately Relevant
    indicators:
    - Provides information that is up-to-date and well-aligned with current standards
    - Includes recent developments or data where appropriate
