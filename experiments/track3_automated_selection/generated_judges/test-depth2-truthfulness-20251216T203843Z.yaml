- id: truthfulness-judge-timeliness-contextual-relevance
  name: Contextual Relevance
  version: '1.0'
  description: This rubric evaluates how effectively the response aligns with the
    specific needs, nuances, and context of the inquiry. It measures whether the answer
    is appropriately tailored, focused, and free from off-topic information relevant
    to the user's question.
  scoring_description: Score how well the response demonstrates contextual relevance
  definition: This rubric evaluates how effectively the response aligns with the specific
    needs, nuances, and context of the inquiry. It measures whether the answer is
    appropriately tailored, focused, and free from off-topic information relevant
    to the user's question.
  criteria:
  - range: [0.0, 0.9]
    label: Not Relevant
    indicators:
    - Response is largely off-topic or unrelated to the question's context.
    - Fails to address the user's specific needs or provides irrelevant information.
    - Shows no consideration of the question's nuances or details.
  - range: [1.0, 1.9]
    label: Minimal Relevance
    indicators:
    - Includes some elements related to the question but mostly off-topic or superficial.
    - Addresses only broad aspects without considering specific context or nuances.
    - Contains irrelevant details that distract from the main inquiry.
  - range: [2.0, 2.9]
    label: Moderately Relevant
    indicators:
    - Generally aligned with the question but lacks depth or full consideration of
      context.
    - Addresses main points but omits important nuances or specific needs.
    - Includes some irrelevant details or minor off-topic elements.
  - range: [3.0, 3.9]
    label: Highly Relevant
    indicators:
    - Well-aligned with the specific context and needs of the question.
    - Addresses nuances and details appropriately, demonstrating understanding of
      the inquiry.
    - Minimally contains off-topic or extraneous information.
  - range: [4.0, 4.0]
    label: Perfectly Relevant
    indicators:
    - Precisely tailored to the user's question and context.
    - Fully considers all nuances and specific needs, providing a focused and comprehensive
      response.
    - Contains no irrelevant or off-topic information, demonstrating deep understanding
      of the inquiry.
  guidelines:
  - Addresses the specific question or scenario posed
  - Avoids including extraneous or unrelated information
  - Tailors the response to the user's context or intent
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-timeliness
- id: truthfulness-judge-timeliness-comprehensiveness
  name: Comprehensiveness
  version: '1.0'
  description: This rubric evaluates the extent to which the response thoroughly addresses
    all relevant aspects of the topic, including recent developments and critical
    details. It assesses whether the answer leaves no significant area unexamined
    and provides a complete understanding of the subject matter.
  scoring_description: Score how well the response demonstrates comprehensiveness
  definition: This rubric evaluates the extent to which the response thoroughly addresses
    all relevant aspects of the topic, including recent developments and critical
    details. It assesses whether the answer leaves no significant area unexamined
    and provides a complete understanding of the subject matter.
  criteria:
  - range: [0.0, 0.9]
    label: Very Incomplete
    indicators:
    - Fails to address most relevant aspects of the topic
    - Omission of critical recent information or updates
    - Provides only superficial or fragmentary details
  - range: [1.0, 1.9]
    label: Largely Incomplete
    indicators:
    - Addresses some relevant aspects but omits key details
    - Includes outdated or incomplete information in critical areas
    - Lacks coverage of recent developments or nuances
  - range: [2.0, 2.9]
    label: Partially Complete
    indicators:
    - Covers most relevant aspects with some omissions
    - Includes some recent information but misses minor updates
    - Addresses the main points but lacks depth in certain areas
  - range: [3.0, 3.9]
    label: Mostly Complete
    indicators:
    - Addresses all major relevant aspects with minor omissions
    - Includes recent developments and key details appropriately
    - Provides a comprehensive overview with some room for additional depth
  - range: [4.0, 4.0]
    label: Fully Complete
    indicators:
    - Thoroughly covers all relevant aspects of the topic
    - Incorporates the latest recent information and updates
    - Provides a detailed, nuanced, and fully comprehensive response
  guidelines:
  - Includes all necessary recent updates or nuances
  - Provides a complete overview without missing critical recent information
  - Addresses potential follow-up concerns related to current developments
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-timeliness
- id: truthfulness-judge-timeliness-accuracy-of-updates
  name: Accuracy of Updates
  version: '1.0'
  description: This rubric assesses the extent to which the response incorporates
    the most recent and verified information available. It evaluates whether the data
    provided reflects current knowledge and avoids outdated or superseded facts.
  scoring_description: Score how well the response demonstrates accuracy of updates
  definition: This rubric assesses the extent to which the response incorporates the
    most recent and verified information available. It evaluates whether the data
    provided reflects current knowledge and avoids outdated or superseded facts.
  criteria:
  - range: [0.0, 0.9]
    label: No Evidence of Recent Updates
    indicators:
    - Contains outdated or obsolete information that has been superseded by newer
      data
    - Fails to reference recent developments or credible sources
    - Includes inaccuracies due to reliance on outdated knowledge
  - range: [1.0, 1.9]
    label: Minimal Incorporation of Recent Data
    indicators:
    - References some recent information but with notable gaps or outdated details
    - Includes minor inaccuracies due to outdated sources or data lag
    - Shows limited awareness of recent developments relevant to the topic
  - range: [2.0, 2.9]
    label: Partially Up-to-Date
    indicators:
    - Mostly reflects current knowledge but omits some recent updates or nuances
    - Contains few inaccuracies, with most information being recent and credible
    - Demonstrates general awareness of recent developments but lacks comprehensive
      coverage
  - range: [3.0, 3.9]
    label: Mostly Accurate with Recent Updates
    indicators:
    - Incorporates the latest verified facts and updates relevant to the topic
    - Provides information aligned with current standards and credible sources
    - Minor omissions of very recent developments but overall accurate and current
  - range: [4.0, 4.0]
    label: Fully Up-to-Date and Accurate
    indicators:
    - Uses the most recent and credible data available, reflecting the latest knowledge
    - Contains no outdated or superseded information
    - Demonstrates comprehensive awareness of recent developments, updates, and ongoing
      changes
  guidelines:
  - Uses verified and current sources
  - Correctly incorporates recent changes or discoveries
  - Avoids citing outdated or invalidated information
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-timeliness
- id: truthfulness-judge-source-reliability
  name: Source Reliability
  version: '1.0'
  description: This rubric evaluates the credibility, authority, and proper citation
    of sources used or implied in the assistant's response. It assesses whether the
    sources are reputable and appropriately referenced to support the claims made.
  scoring_description: Score how well the response demonstrates source reliability
  definition: This rubric evaluates the credibility, authority, and proper citation
    of sources used or implied in the assistant's response. It assesses whether the
    sources are reputable and appropriately referenced to support the claims made.
  criteria:
  - range: [0.0, 0.9]
    label: Unreliable or No Sources
    indicators:
    - No sources are cited or implied in the response.
    - Sources, if any, are clearly unreliable, non-authoritative, or fabricated.
    - Claims are unsupported by any verifiable references.
  - range: [1.0, 1.9]
    label: Weak or Inappropriate Sources
    indicators:
    - Sources cited are of questionable credibility or relevance.
    - References are outdated, non-authoritative, or poorly matched to the claims.
    - Minimal or superficial citation practices that do not substantiate key points.
  - range: [2.0, 2.9]
    label: Somewhat Reliable Sources
    indicators:
    - Sources are generally reputable but may lack specificity or detailed citation.
    - References support the main claims but may omit context or nuances.
    - Minor issues with source relevance or completeness.
  - range: [3.0, 3.9]
    label: Mostly Reliable and Properly Cited
    indicators:
    - Sources are reputable, authoritative, and appropriately cited.
    - References support claims accurately with relevant details.
    - Minor lapses in citation style or scope, but overall credible.
  - range: [4.0, 4.0]
    label: Highly Reliable and Well-Referenced
    indicators:
    - Sources are authoritative, peer-reviewed, or from highly reputable institutions.
    - All claims are supported by proper, precise citations with correct formatting.
    - Sources are current, relevant, and thoroughly support the claims made.
  guidelines:
  - References authoritative and peer-reviewed sources
  - Avoids dubious or unverified references
  - Sources are clearly identified and appropriate
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge
- id: truthfulness-judge-source-reliability-source_authority
  name: Source Authority
  version: '1.0'
  description: This rubric evaluates the credibility and reputation of the sources
    cited or implied in the response. It assesses whether the sources originate from
    well-established, reputable, and authoritative entities relevant to the claims
    made.
  scoring_description: Score how well the response demonstrates source authority
  definition: This rubric evaluates the credibility and reputation of the sources
    cited or implied in the response. It assesses whether the sources originate from
    well-established, reputable, and authoritative entities relevant to the claims
    made.
  criteria:
  - range: [0.0, 0.9]
    label: No Credible Sources
    indicators:
    - No sources are cited or implied in the response.
    - Sources, if any, are from dubious or unverified entities.
    - Claims are unsupported by any reputable references.
  - range: [1.0, 1.9]
    label: Questionable or Non-Authoritative Sources
    indicators:
    - Sources cited are from entities with limited or questionable reputation.
    - References lack relevance or are outdated.
    - Sources are minimally authoritative and do not strongly support claims.
  - range: [2.0, 2.9]
    label: Somewhat Reputable Sources
    indicators:
    - Sources are from generally reputable organizations or publications.
    - References support the claims but may lack depth or full relevance.
    - Sources are appropriate but not from top-tier or peer-reviewed entities.
  - range: [3.0, 3.9]
    label: Reputable and Well-Established Sources
    indicators:
    - Sources are from authoritative, well-known institutions or publications.
    - References are relevant, current, and support claims effectively.
    - Sources demonstrate a clear credibility and appropriate relevance.
  - range: [4.0, 4.0]
    label: Highly Reputable and Authoritative Sources
    indicators:
    - Sources are from leading, peer-reviewed, or highly reputable organizations.
    - References are current, precise, and thoroughly support all claims.
    - Sources exemplify the highest standards of credibility and authority.
  guidelines:
  - Sources are from peer-reviewed journals or reputable institutions
  - Sources are recognized experts or authoritative organizations
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-source-reliability
- id: truthfulness-judge-source-reliability-citation_quality
  name: Citation Completeness and Accuracy
  version: '1.0'
  description: This rubric assesses the thoroughness, correctness, and clarity of
    source citations within the response. It evaluates whether sources are properly
    formatted, explicitly linked to the claims they support, and provide sufficient
    detail for verification.
  scoring_description: Score how well the response demonstrates citation completeness
    and accuracy
  definition: This rubric assesses the thoroughness, correctness, and clarity of source
    citations within the response. It evaluates whether sources are properly formatted,
    explicitly linked to the claims they support, and provide sufficient detail for
    verification.
  criteria:
  - range: [0.0, 0.9]
    label: No or Incorrect Citations
    indicators:
    - No sources are cited or references are entirely missing.
    - Citations, if present, are completely incorrect, fabricated, or irrelevant.
    - Claims are unsupported by any form of source attribution.
  - range: [1.0, 1.9]
    label: Minimal and Poorly Formatted Citations
    indicators:
    - Sources are cited but lack necessary details such as author, date, or publication.
    - Formatting is inconsistent or incorrect, making verification difficult.
    - Citations are superficial and do not clearly support specific claims.
  - range: [2.0, 2.9]
    label: Basic and Partially Accurate Citations
    indicators:
    - Sources are cited with some relevant details but may omit key information like
      publication date or page numbers.
    - Formatting is generally correct but may have minor inconsistencies.
    - Citations support the main claims but lack depth or complete specificity.
  - range: [3.0, 3.9]
    label: Thorough and Correct Citations
    indicators:
    - Sources are properly formatted with all necessary details (author, title, date,
      publisher, etc.).
    - Citations are explicitly linked to specific claims, enhancing transparency.
    - References are clear, accurate, and facilitate verification.
  - range: [4.0, 4.0]
    label: Exemplary and Fully Verified Citations
    indicators:
    - Sources are impeccably formatted according to standard citation styles.
    - All claims are supported by precise, complete, and relevant references.
    - Citations include direct links or identifiers (e.g., DOI, URL) for easy verification,
      demonstrating thoroughness.
  guidelines:
  - Sources are properly formatted with complete bibliographic details
  - References directly support the specific claims made
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-source-reliability
- id: truthfulness-judge-source-reliability-source recency
  name: Source Recency
  version: '1.0'
  description: This rubric assesses the timeliness and current relevance of the sources
    referenced or implied in the response. It evaluates whether the sources are recent
    enough to support up-to-date and accurate claims.
  scoring_description: Score how well the response demonstrates source recency
  definition: This rubric assesses the timeliness and current relevance of the sources
    referenced or implied in the response. It evaluates whether the sources are recent
    enough to support up-to-date and accurate claims.
  criteria:
  - range: [0.0, 0.9]
    label: Very Outdated
    indicators:
    - Sources are more than 10 years old and no recent updates are evident.
    - References are outdated and do not reflect current knowledge or standards.
    - Sources are irrelevant to current context or recent developments.
  - range: [1.0, 1.9]
    label: Mostly Outdated
    indicators:
    - Sources are between 7 to 10 years old with limited recent updates.
    - References may lack relevance to current standards or understanding.
    - Some sources are outdated but still somewhat relevant.
  - range: [2.0, 2.9]
    label: Moderately Recent
    indicators:
    - Sources are between 3 to 6 years old, generally reflecting recent knowledge.
    - References support current understanding but may lack the latest developments.
    - Some minor outdated elements but overall reasonably current.
  - range: [3.0, 3.9]
    label: Recent
    indicators:
    - Sources are within the last 1 to 3 years, reflecting recent research or standards.
    - References are relevant and support current claims effectively.
    - Few, if any, outdated references; sources are generally up-to-date.
  - range: [4.0, 4.0]
    label: Very Recent
    indicators:
    - Sources are from the past year or are the latest available in the field.
    - References are highly relevant, current, and reflect the most recent developments.
    - Sources demonstrate thorough engagement with up-to-date information.
  guidelines:
  - Sources are recent and up-to-date
  - References reflect the latest research or data available
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-source-reliability
