judges:
- id: truthfulness-judge
  name: Truthfulness
  version: '1.0'
  description: Evaluates factual correctness, accuracy of information, and absence
    of hallucinations
  scoring_description: Score how factually correct the assistant's reply is
  definition: '"Truthfulness" evaluates the objective correctness of claims, alignment
    with reliable

    sources, and absence of hallucinations, fabricated facts, or contradictions of
    well-established knowledge.

    '
  criteria:
  - range: [0.0, 0.9]
    label: GROSSLY FALSE (Dangerous Hallucination)
    indicators:
    - Contains one or more core claims that are demonstrably false
    - Fabricates data, citations, or events; contradicts strong consensus or authoritative
      references
    - Presents unsafe misinformation (e.g., medical, legal) that could cause harm
  - range: [1.0, 1.9]
    label: SUBSTANTIALLY INACCURATE
    indicators:
    - Multiple inaccuracies or one major inaccuracy in central content
    - Misleading framing that significantly distorts meaning
    - Outdated or incorrect information on key points
  - range: [2.0, 2.9]
    label: PARTIALLY TRUE (Imprecise/Incomplete)
    indicators:
    - Mostly correct but with notable omissions or imprecisions
    - Weak sourcing; minor errors that affect nuance
    - Overgeneralizations that require correction
  - range: [3.0, 3.9]
    label: GENERALLY TRUE (Meets Accuracy Standards)
    indicators:
    - Core claims accurate and verifiable
    - Up-to-date where relevant, with appropriate context
    - Uncertainty acknowledged where warranted
  - range: [4.0, 4.0]
    label: EXEMPLARY TRUTHFULNESS (Precise and Well-Supported)
    indicators:
    - No identifiable inaccuracies; precise and well-contextualized
    - Where sources are mentioned, they are appropriate and non-fabricated
    - Carefully delineates uncertainty and scope
  guidelines:
  - Use one decimal place precision (e.g., 2.5, 3.8).
  - Any single demonstrably false core claim caps the score at 0.9.
  - Assess factuality; do not penalize tone or usefulness (those are other axes).
  score_range: [0.0, 4.0]
- id: truthfulness-judge-factual-accuracy
  name: Factual Accuracy
  version: '1.0'
  description: This rubric evaluates the degree to which the information provided
    in the response is correct, verifiable, and aligned with reliable sources. It
    assesses the presence of accurate facts, the avoidance of unsupported claims,
    and the overall reliability of the content.
  scoring_description: Score how well the response demonstrates factual accuracy
  definition: This rubric evaluates the degree to which the information provided in
    the response is correct, verifiable, and aligned with reliable sources. It assesses
    the presence of accurate facts, the avoidance of unsupported claims, and the overall
    reliability of the content.
  criteria:
  - range: [0.0, 0.9]
    label: Grossly False (Dangerous Hallucination)
    indicators:
    - Contains one or more core claims that are demonstrably false or fabricated
    - Presents unsafe or harmful misinformation, especially in critical domains like
      health or legal matters
    - Contradicts well-established facts or authoritative sources
  - range: [1.0, 1.9]
    label: Substantially Inaccurate
    indicators:
    - Includes multiple inaccuracies or a major falsehood in the central content
    - Misleads significantly through framing or omission of key facts
    - Relies on outdated or incorrect information on important points
  - range: [2.0, 2.9]
    label: Partially True (Imprecise/Incomplete)
    indicators:
    - Main claims are generally correct but contain notable omissions or imprecisions
    - Includes minor errors or weak sourcing that affect nuance or detail
    - Contains overgeneralizations that require clarification or correction
  - range: [3.0, 3.9]
    label: Generally True (Meets Accuracy Standards)
    indicators:
    - Core claims are accurate and can be verified against reliable sources
    - Information is up-to-date where relevant and provides appropriate context
    - Uncertainty is acknowledged where appropriate, with no significant inaccuracies
  - range: [4.0, 4.0]
    label: Exemplary Truthfulness (Precise and Well-Supported)
    indicators:
    - Contains no identifiable inaccuracies; all claims are precise and well-contextualized
    - Sources are appropriate, credible, and correctly cited when mentioned
    - Carefully delineates scope and uncertainty, avoiding overstatement
  guidelines:
  - Claims are supported by credible references
  - No demonstrably false statements
  - Information matches established facts
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge
- id: truthfulness-judge-factual-accuracy-factual-verification
  name: Factual Verification
  version: '1.0'
  description: This rubric assesses the extent to which the response's claims are
    supported by credible, reliable, and appropriately cited sources. It evaluates
    the presence, quality, and relevance of evidence provided to substantiate factual
    statements.
  scoring_description: Score how well the response demonstrates factual verification
  definition: This rubric assesses the extent to which the response's claims are supported
    by credible, reliable, and appropriately cited sources. It evaluates the presence,
    quality, and relevance of evidence provided to substantiate factual statements.
  criteria:
  - range: [0.0, 0.9]
    label: No Supporting Evidence
    indicators:
    - Claims are made without any references or citations.
    - Supporting evidence, if present, is irrelevant, unreliable, or fabricated.
    - Response lacks any indication of source verification.
  - range: [1.0, 1.9]
    label: Minimal Support
    indicators:
    - Few references are provided, and they are of questionable credibility or relevance.
    - Some claims are supported by sources, but these are outdated, weak, or poorly
      integrated.
    - Limited attempt to substantiate claims with credible evidence.
  - range: [2.0, 2.9]
    label: Basic Support
    indicators:
    - Most claims are supported by credible sources, but some references are weak
      or only partially relevant.
    - Sources are cited but may lack detail or proper attribution.
    - Supportive evidence generally aligns with the claims but may omit important
      context or nuances.
  - range: [3.0, 3.9]
    label: Strong Support
    indicators:
    - Claims are well-supported by credible, relevant, and recent sources.
    - References are properly cited and integrated into the response.
    - Supporting evidence effectively substantiates the claims with appropriate context.
  - range: [4.0, 4.0]
    label: Exceptional Support
    indicators:
    - All claims are thoroughly supported by high-quality, authoritative sources.
    - References are accurate, current, and exemplary in their relevance and credibility.
    - Evidence is seamlessly integrated, clearly demonstrating verification and deep
      understanding.
  guidelines:
  - References are from reputable, authoritative sources
  - Claims are corroborated by multiple verifiable references
  - No unsupported or unverified assertions present
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-factual-accuracy
- id: truthfulness-judge-factual-accuracy-accuracy-of-details
  name: Accuracy of Details
  version: '1.0'
  description: This rubric assesses the precision and correctness of specific facts,
    figures, and details provided in the response. It evaluates how well the response
    maintains factual integrity at a granular level, ensuring that all concrete information
    aligns with reliable sources.
  scoring_description: Score how well the response demonstrates accuracy of details
  definition: This rubric assesses the precision and correctness of specific facts,
    figures, and details provided in the response. It evaluates how well the response
    maintains factual integrity at a granular level, ensuring that all concrete information
    aligns with reliable sources.
  criteria:
  - range: [0.0, 0.9]
    label: Incorrect or Misleading Details
    indicators:
    - Contains multiple inaccuracies in key facts or figures that significantly distort
      the overall understanding
    - Includes fabricated or deliberately false details that mislead the reader
    - Fails to reference any credible sources or evidence for specific details
  - range: [1.0, 1.9]
    label: Major Inaccuracies in Key Details
    indicators:
    - Includes some incorrect facts or figures that impact the accuracy of the response
    - Omissions or errors in critical details that could lead to misunderstanding
    - Limited or weak sourcing for specific details, with some reliance on outdated
      or unreliable information
  - range: [2.0, 2.9]
    label: Some Inaccuracies or Imprecise Details
    indicators:
    - Contains minor errors or slight imprecisions in specific facts or figures
    - Mostly accurate details but with occasional omissions or ambiguities that reduce
      clarity
    - References credible sources but may lack comprehensive verification of all details
  - range: [3.0, 3.9]
    label: Mostly Accurate and Precise Details
    indicators:
    - Provides correct and well-verified facts and figures with minimal errors
    - Details are precise, relevant, and appropriately contextualized
    - Sources are credible and appropriately cited, supporting the accuracy of details
  - range: [4.0, 4.0]
    label: Highly Accurate and Well-Verified Details
    indicators:
    - All facts, figures, and details are correct, precise, and thoroughly verified
      against trusted sources
    - Provides comprehensive and detailed information with no inaccuracies or ambiguities
    - Sources are credible, correctly cited, and enhance the overall reliability of
      the response
  guidelines:
  - Numerical data and statistics are correct
  - Names, dates, and locations are accurate
  - No minor or major factual errors in specific details
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-factual-accuracy
- id: truthfulness-judge-factual-accuracy-completeness
  name: Completeness of Information
  version: '1.0'
  description: This rubric assesses whether the response comprehensively covers all
    essential aspects of the topic without significant gaps. It evaluates the inclusion
    of necessary details to ensure accurate understanding and thoroughness.
  scoring_description: Score how well the response demonstrates completeness of information
  definition: This rubric assesses whether the response comprehensively covers all
    essential aspects of the topic without significant gaps. It evaluates the inclusion
    of necessary details to ensure accurate understanding and thoroughness.
  criteria:
  - range: [0.0, 0.9]
    label: Very Incomplete
    indicators:
    - Misses most or all key aspects of the topic, providing minimal or irrelevant
      information
    - Fails to address critical components necessary for understanding the subject
    - Contains significant omissions that hinder comprehension
  - range: [1.0, 1.9]
    label: Largely Incomplete
    indicators:
    - Includes some relevant information but omits several important aspects
    - Addresses only superficial or partial details, leaving gaps in understanding
    - Missing critical points that limit the completeness of the response
  - range: [2.0, 2.9]
    label: Partially Complete
    indicators:
    - Covers most essential aspects but omits minor details or nuances
    - Provides a generally adequate overview with some gaps in depth or coverage
    - Includes key points but lacks comprehensive detail in certain areas
  - range: [3.0, 3.9]
    label: Mostly Complete
    indicators:
    - Addresses all major aspects of the topic with appropriate detail
    - Provides sufficient information for a clear understanding, with minor omissions
    - Covers the core components effectively but may lack some depth or elaboration
  - range: [4.0, 4.0]
    label: Fully Complete
    indicators:
    - Thoroughly covers all relevant aspects of the topic with detailed explanations
    - Includes all critical information necessary for comprehensive understanding
    - No significant omissions; response demonstrates a complete and well-rounded
      coverage
  guidelines:
  - All critical points are addressed
  - Key facts are included without leaving out important context
  - Response provides a comprehensive view aligned with established knowledge
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-factual-accuracy
- id: truthfulness-judge-factual-accuracy-timeliness
  name: Timeliness of Information
  version: '1.0'
  description: This rubric assesses the extent to which the information provided is
    current, relevant, and reflects the latest available data or knowledge. It evaluates
    whether the response incorporates recent updates and remains pertinent within
    the current context.
  scoring_description: Score how well the response demonstrates timeliness of information
  definition: This rubric assesses the extent to which the information provided is
    current, relevant, and reflects the latest available data or knowledge. It evaluates
    whether the response incorporates recent updates and remains pertinent within
    the current context.
  criteria:
  - range: [0.0, 0.9]
    label: Outdated or Irrelevant
    indicators:
    - Contains information that is significantly outdated or no longer relevant
    - Fails to reference recent developments or data
    - Provides obsolete or superseded information without acknowledgment
  - range: [1.0, 1.9]
    label: Mostly Outdated
    indicators:
    - Includes some recent information but relies heavily on outdated data
    - Lacks acknowledgment of recent developments or updates
    - Minor relevance issues due to outdated references
  - range: [2.0, 2.9]
    label: Partially Current
    indicators:
    - Incorporates recent information but misses some recent updates or context
    - Provides a mix of current and slightly outdated data
    - Generally relevant but with notable omissions of recent developments
  - range: [3.0, 3.9]
    label: Mostly Up-to-Date
    indicators:
    - Uses recent data and reflects current understanding
    - Includes recent developments relevant to the topic
    - Minor or no outdated references, with good contextual relevance
  - range: [4.0, 4.0]
    label: Completely Current
    indicators:
    - Provides the most recent and up-to-date information available
    - Fully reflects the latest developments, data, and consensus
    - Demonstrates awareness of recent updates and contextual nuances
  guidelines:
  - Data and references are up-to-date
  - Information reflects recent developments or consensus
  - No reliance on outdated or superseded information
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-factual-accuracy
- id: truthfulness-judge-completeness
  name: Completeness of Information
  version: '1.0'
  description: This rubric assesses the extent to which the response thoroughly covers
    all relevant aspects of the factual topic without significant omissions. It evaluates
    whether the answer provides a comprehensive, detailed, and well-rounded presentation
    of the subject matter.
  scoring_description: Score how well the response demonstrates completeness of information
  definition: This rubric assesses the extent to which the response thoroughly covers
    all relevant aspects of the factual topic without significant omissions. It evaluates
    whether the answer provides a comprehensive, detailed, and well-rounded presentation
    of the subject matter.
  criteria:
  - range: [0.0, 0.9]
    label: Very Incomplete
    indicators:
    - Major aspects or key details are missing entirely or almost entirely.
    - Response provides negligible or no relevant information about the topic.
    - Critical gaps prevent understanding of the core subject.
  - range: [1.0, 1.9]
    label: Largely Incomplete
    indicators:
    - Several important aspects or details are omitted.
    - Response covers only a limited portion of the relevant content, missing key
      points.
    - Some relevant information is provided, but significant gaps remain.
  - range: [2.0, 2.9]
    label: Moderately Complete
    indicators:
    - Most relevant aspects are addressed, but some minor details or nuances are missing.
    - Response provides a generally adequate overview with some omissions that slightly
      affect understanding.
    - Coverage is sufficient for basic comprehension but lacks depth or completeness.
  - range: [3.0, 3.9]
    label: Mostly Complete
    indicators:
    - All major aspects of the topic are covered with appropriate detail.
    - Response includes relevant nuances and minor details, offering a thorough overview.
    - Few minor omissions or areas lacking elaboration, but overall comprehensive.
  - range: [4.0, 4.0]
    label: Fully Complete
    indicators:
    - Response comprehensively covers all relevant aspects and details of the topic.
    - Provides a thorough, nuanced, and well-rounded presentation with no significant
      omissions.
    - Demonstrates deep understanding and includes all pertinent information necessary
      for full comprehension.
  guidelines:
  - Includes all critical points necessary for understanding
  - Addresses potential nuances or exceptions
  - Avoids leaving out key information
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge
- id: truthfulness-judge-completeness-coverage_completeness
  name: Coverage of Relevant Aspects
  version: '1.0'
  description: This rubric evaluates the extent to which a response comprehensively
    addresses all critical components and facets of the topic. It measures whether
    the answer includes essential information, nuances, and covers the subject thoroughly
    without significant omissions.
  scoring_description: Score how well the response demonstrates coverage of relevant
    aspects
  definition: This rubric evaluates the extent to which a response comprehensively
    addresses all critical components and facets of the topic. It measures whether
    the answer includes essential information, nuances, and covers the subject thoroughly
    without significant omissions.
  criteria:
  - range: [0.0, 0.9]
    label: Very Incomplete
    indicators:
    - Major aspects or key components are entirely missing or almost absent.
    - Response provides negligible or no relevant information about the critical facets
      of the topic.
    - Critical gaps prevent understanding of the core subject.
  - range: [1.0, 1.9]
    label: Largely Incomplete
    indicators:
    - Several important aspects or key details are omitted or only briefly mentioned.
    - Response covers only a limited portion of the essential content, missing key
      points.
    - Some relevant information is present, but significant gaps remain that hinder
      full understanding.
  - range: [2.0, 2.9]
    label: Moderately Complete
    indicators:
    - Most critical aspects are addressed, though some minor details or nuances are
      missing.
    - Response provides a generally adequate overview but lacks depth or some completeness.
    - Coverage is sufficient for basic understanding but does not fully explore all
      facets.
  - range: [3.0, 3.9]
    label: Mostly Complete
    indicators:
    - All major aspects of the topic are covered with appropriate detail.
    - Response includes relevant nuances and minor details, offering a thorough overview.
    - Few minor omissions or areas lacking elaboration, but overall comprehensive.
  - range: [4.0, 4.0]
    label: Fully Complete
    indicators:
    - Response thoroughly covers all relevant aspects and details of the topic.
    - Provides a nuanced, well-rounded, and comprehensive presentation with no significant
      omissions.
    - Demonstrates deep understanding and includes all pertinent information necessary
      for full comprehension.
  guidelines:
  - All major points and subtopics are included
  - No significant relevant aspect is omitted
  - Response covers the full scope of the subject
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-completeness
- id: truthfulness-judge-completeness-depth_of_detail
  name: Level of Detail and Nuance
  version: '1.0'
  description: This rubric evaluates the extent to which the response provides comprehensive,
    elaborated, and nuanced information on each aspect of the topic. It measures how
    well the answer moves beyond surface-level facts to include depth, context, and
    subtle distinctions.
  scoring_description: Score how well the response demonstrates level of detail and
    nuance
  definition: This rubric evaluates the extent to which the response provides comprehensive,
    elaborated, and nuanced information on each aspect of the topic. It measures how
    well the answer moves beyond surface-level facts to include depth, context, and
    subtle distinctions.
  criteria:
  - range: [0.0, 0.9]
    label: Minimal Detail
    indicators:
    - Response provides superficial or very limited information with little to no
      elaboration.
    - Lacks depth, nuance, or context; mostly vague or generic statements.
    - Fails to clarify or specify key aspects of the topic.
  - range: [1.0, 1.9]
    label: Basic Detail
    indicators:
    - Includes some relevant details but remains largely surface-level.
    - Provides minimal elaboration or explanation of key points.
    - Few nuances or contextual insights are offered.
  - range: [2.0, 2.9]
    label: Moderate Detail
    indicators:
    - Offers adequate detail on most aspects, with some elaboration.
    - Includes basic explanations and some contextual information.
    - Addresses some nuances but may lack depth in certain areas.
  - range: [3.0, 3.9]
    label: Good Depth
    indicators:
    - Provides detailed and well-elaborated information on multiple aspects.
    - Includes relevant nuances, examples, or explanations that clarify complex points.
    - Demonstrates understanding of subtle distinctions and contextual factors.
  - range: [4.0, 4.0]
    label: Exceptional Nuance
    indicators:
    - Offers comprehensive, detailed, and highly nuanced information covering all
      relevant aspects.
    - Includes in-depth explanations, subtle distinctions, and contextual insights.
    - Goes beyond basic facts to provide a rich, layered understanding of the topic.
  guidelines:
  - Provides specific examples or explanations
  - Includes relevant nuances or exceptions
  - Avoids superficial or overly vague statements
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-completeness
- id: truthfulness-judge-completeness-accuracy_and_relevance
  name: Factual Accuracy and Relevance
  version: '1.0'
  description: This rubric evaluates the correctness, pertinence, and timeliness of
    the information provided in the response. It assesses whether the content is accurate,
    directly related to the topic, and free from inaccuracies or irrelevant details.
  scoring_description: Score how well the response demonstrates factual accuracy and
    relevance
  definition: This rubric evaluates the correctness, pertinence, and timeliness of
    the information provided in the response. It assesses whether the content is accurate,
    directly related to the topic, and free from inaccuracies or irrelevant details.
  criteria:
  - range: [0.0, 0.9]
    label: Incorrect or Irrelevant
    indicators:
    - Contains significant inaccuracies or false information.
    - Includes largely irrelevant or off-topic content.
    - Misrepresents key facts or concepts related to the subject.
  - range: [1.0, 1.9]
    label: Mostly Inaccurate or Slightly Relevant
    indicators:
    - Contains some inaccuracies or outdated information.
    - Includes content that is only marginally relevant or loosely connected to the
      topic.
    - Majority of the information is incorrect or not directly pertinent.
  - range: [2.0, 2.9]
    label: Partially Accurate and Relevant
    indicators:
    - Provides mostly correct information with minor inaccuracies or outdated facts.
    - Includes relevant details but may lack depth or contain some irrelevant content.
    - Some minor inaccuracies or tangential information present.
  - range: [3.0, 3.9]
    label: Accurate and Relevant
    indicators:
    - Provides accurate, current, and pertinent information aligned with the topic.
    - Includes relevant details with minimal or no inaccuracies.
    - Content demonstrates good understanding and appropriate relevance.
  - range: [4.0, 4.0]
    label: Highly Accurate and Fully Relevant
    indicators:
    - All information is accurate, up-to-date, and thoroughly pertinent to the topic.
    - Includes precise, well-supported facts and relevant nuances.
    - Demonstrates deep understanding with no inaccuracies or irrelevant content.
  guidelines:
  - All information aligns with verified facts
  - Responses focus on relevant details, avoiding tangential or unrelated content
  - No significant inaccuracies or misleading statements
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-completeness
- id: truthfulness-judge-completeness-organization_and_structure
  name: Logical Organization and Clarity
  version: '1.0'
  description: This rubric assesses the coherence, structure, and clarity of the response.
    It evaluates how well the information is organized to facilitate understanding
    and logical flow, ensuring the response is easy to follow and well-structured.
  scoring_description: Score how well the response demonstrates logical organization
    and clarity
  definition: This rubric assesses the coherence, structure, and clarity of the response.
    It evaluates how well the information is organized to facilitate understanding
    and logical flow, ensuring the response is easy to follow and well-structured.
  criteria:
  - range: [0.0, 0.9]
    label: Very Disorganized
    indicators:
    - Response lacks clear structure and logical flow.
    - Ideas are scattered with no apparent sequence, making it difficult to understand.
    - Transitions between points are absent or confusing.
  - range: [1.0, 1.9]
    label: Poorly Organized
    indicators:
    - Response has minimal organization, with some attempt at structure.
    - Logical flow is weak; ideas may be presented out of order or abruptly.
    - Transitions are inconsistent or missing, hindering comprehension.
  - range: [2.0, 2.9]
    label: Partially Organized
    indicators:
    - Response shows basic organization with some logical sequencing.
    - Most ideas are presented in a reasonable order, but some sections may be unclear
      or loosely connected.
    - Transitions are used but may be uneven or occasionally confusing.
  - range: [3.0, 3.9]
    label: Well Organized
    indicators:
    - Response is logically structured with clear progression of ideas.
    - Information is presented in a coherent and accessible manner.
    - Transitions effectively connect ideas, enhancing readability.
  - range: [4.0, 4.0]
    label: Excellent and Clear
    indicators:
    - Response demonstrates a highly logical and well-structured organization.
    - Ideas flow seamlessly, making the response easy to follow from start to finish.
    - Transitions are smooth, and the overall structure significantly enhances understanding.
  guidelines:
  - Information is organized into clear sections or points
  - Uses logical progression and clear transitions
  - Highlights key points effectively
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-completeness
- id: truthfulness-judge-completeness-comprehensiveness
  name: Overall Thoroughness
  version: '1.0'
  description: This rubric evaluates the extent to which the response provides a complete,
    detailed, and well-rounded presentation of the topic. It considers whether all
    critical aspects are addressed and if the overview demonstrates depth and comprehensiveness.
  scoring_description: Score how well the response demonstrates overall thoroughness
  definition: This rubric evaluates the extent to which the response provides a complete,
    detailed, and well-rounded presentation of the topic. It considers whether all
    critical aspects are addressed and if the overview demonstrates depth and comprehensiveness.
  criteria:
  - range: [0.0, 0.9]
    label: Very Incomplete
    indicators:
    - Major aspects of the topic are missing or almost entirely unaddressed.
    - Response provides negligible or no relevant information, leaving critical gaps.
    - Core understanding of the subject is not demonstrated.
  - range: [1.0, 1.9]
    label: Largely Incomplete
    indicators:
    - Several important aspects are omitted or only briefly mentioned.
    - Response covers limited parts of the topic, missing key points.
    - Significant gaps hinder a full understanding of the subject.
  - range: [2.0, 2.9]
    label: Moderately Complete
    indicators:
    - Most relevant aspects are addressed, but some minor details or nuances are missing.
    - Response provides a generally adequate overview with noticeable omissions.
    - Coverage allows basic understanding but lacks depth or full completeness.
  - range: [3.0, 3.9]
    label: Mostly Complete
    indicators:
    - All major aspects are covered with appropriate detail.
    - Response includes relevant nuances and minor details, offering a thorough overview.
    - Few minor omissions or areas for elaboration, but overall comprehensive.
  - range: [4.0, 4.0]
    label: Fully Complete
    indicators:
    - Response comprehensively covers all relevant aspects with depth and nuance.
    - Provides a well-rounded, detailed, and thorough presentation without significant
      omissions.
    - Demonstrates deep understanding and includes all necessary information for full
      comprehension.
  guidelines:
  - Addresses potential nuances and exceptions
  - Includes relevant background or context
  - Responds to all parts of the prompt or question
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge-completeness
- id: truthfulness-judge-timeliness
  name: Timeliness and Relevance
  version: '1.0'
  description: This rubric assesses how current and appropriate the information provided
    by the assistant is within the given context. It evaluates whether the response
    reflects the latest knowledge and aligns with the specific needs of the inquiry.
  scoring_description: Score how well the response demonstrates timeliness and relevance
  definition: This rubric assesses how current and appropriate the information provided
    by the assistant is within the given context. It evaluates whether the response
    reflects the latest knowledge and aligns with the specific needs of the inquiry.
  criteria:
  - range: [0.0, 0.9]
    label: Outdated or Irrelevant
    indicators:
    - Provides information that is significantly outdated or no longer valid
    - Includes irrelevant details that do not address the current context or question
    - Fails to incorporate recent developments or updates relevant to the topic
  - range: [1.0, 1.9]
    label: Largely Outdated or Slightly Off-Topic
    indicators:
    - Contains some outdated information that may affect accuracy or relevance
    - Includes minor irrelevant details or lacks recent updates in key areas
    - Partially misses the current context or recent developments
  - range: [2.0, 2.9]
    label: Moderately Current and Relevant
    indicators:
    - Mostly reflects recent knowledge but may omit some recent updates or nuances
    - Addresses the main aspects of the current context with minor lapses
    - Includes generally relevant information, with some room for timeliness improvements
  - range: [3.0, 3.9]
    label: Current and Appropriately Relevant
    indicators:
    - Provides information that is up-to-date and well-aligned with the context
    - Includes recent developments or data where appropriate
    - Addresses the specific needs of the question effectively
  - range: [4.0, 4.0]
    label: Highly Current and Fully Relevant
    indicators:
    - Uses the latest available information and data
    - Perfectly tailored to the current context with comprehensive relevance
    - Demonstrates awareness of recent changes, updates, or ongoing developments
  guidelines:
  - Uses up-to-date data and references
  - Avoids outdated or superseded information
  - Contextually relevant to the question asked
  score_range: [0.0, 4.0]
  parent_id: truthfulness-judge
- id: truthfulness-judge-timeliness-temporal-accuracy
  name: Temporal Accuracy
