- id: truthfulness-judge-absence-of-hallucination-minor-hallucinations
  name: Minor Hallucinations
  version: '1.0'
  description: This rubric evaluates the presence of small, infrequent unsupported
    details within the response. It measures how minor inaccuracies or assumptions
    are integrated into the overall factual correctness, ensuring they are unlikely
    to cause confusion or mistrust.
  scoring_description: Score how well the response demonstrates minor hallucinations
  definition: This rubric evaluates the presence of small, infrequent unsupported
    details within the response. It measures how minor inaccuracies or assumptions
    are integrated into the overall factual correctness, ensuring they are unlikely
    to cause confusion or mistrust.
  criteria:
  - range: [0.0, 0.9]
    label: No Minor Hallucinations
    indicators:
    - Response contains no unsupported or inaccurate details.
    - All information is fully supported or clearly identified as assumptions.
    - Response is factually accurate with no minor deviations.
  - range: [1.0, 1.9]
    label: Minimal Minor Hallucinations
    indicators:
    - Contains very few unsupported details, which are minor and unlikely to mislead.
    - Most information is accurate, with only isolated minor assumptions or minor
      inaccuracies.
    - Minor hallucinations are present but do not affect overall understanding.
  - range: [2.0, 2.9]
    label: Occasional Minor Hallucinations
    indicators:
    - Includes some unsupported details that are isolated and peripheral.
    - Most of the response remains accurate, with a few minor inaccuracies or assumptions.
    - Minor hallucinations are unlikely to significantly impact the overall credibility.
  - range: [3.0, 3.9]
    label: Frequent Minor Hallucinations
    indicators:
