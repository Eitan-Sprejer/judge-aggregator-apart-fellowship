judges:
- id: helpsteer2-helpfulness-judge-relevance-to-intent
  name: Relevance to User Intent
  version: '1.0'
  description: "Measures how directly a response targets the user\u2019s stated goal\
    \ and avoids digressions. Penalizes restatements, filler, and tangents; rewards\
    \ purpose-built content that prioritizes the core task and context. Higher scores\
    \ indicate tighter focus and immediate, on-target guidance."
  scoring_description: Score how well the response demonstrates relevance to user
    intent
  definition: "Measures how directly a response targets the user\u2019s stated goal\
    \ and avoids digressions. Penalizes restatements, filler, and tangents; rewards\
    \ purpose-built content that prioritizes the core task and context. Higher scores\
    \ indicate tighter focus and immediate, on-target guidance."
  criteria:
  - range: [0.0, 0.9]
    label: Off-Topic/Not Aligned
    indicators:
    - 'No substantive relevance: addresses a different task or is purely filler/irrelevant.'
    - Actively distracts or misleads from the goal (e.g., unrelated instructions,
      promotions).
    - Restates the prompt or offers empty disclaimers without any movement toward
      the task.
  - range: [1.0, 1.9]
    label: Low Alignment
    indicators:
    - "\u226440% of content pertains to the goal; mostly generic, off-track, or rephrasing\
      \ the question."
    - Hints at the topic but lacks a direct answer or actionable targeting of the
      core task.
    - Misinterprets intent or focuses on secondary/adjacent issues.
  - range: [2.0, 2.9]
    label: Partial Alignment
    indicators:
    - "Approximately 40\u201370% of content is relevant; significant portions are\
      \ generic, tangential, or restate the prompt."
    - Addresses the main goal only partially or late; relevant points are buried among
      filler.
    - Peripheral details receive equal or greater emphasis than the core task.
  - range: [3.0, 3.9]
    label: Mostly Aligned
    indicators:
    - "About 70\u201390% of content directly targets the core goal, with minor tangents\
      \ or brief restatement."
    - Main answer appears early and remains the focus; small off-topic elements do
      not impede use.
    - "Some tailoring to the user\u2019s context; limited generic phrasing present."
  - range: [4.0, 4.0]
    label: Fully Aligned
    indicators:
    - "\u226590% of content is directly tied to executing the user\u2019s core goal;\
      \ extraneous material is negligible."
    - Core answer is provided immediately and maintained without tangents or unnecessary
      restatement.
    - "Content is purpose-built to the user\u2019s stated context/constraints, prioritizing\
      \ the primary objective over peripheral details."
  guidelines:
  - Directly answers the question or task the user posed
  - Avoids unrelated content or tangents
  - "Frames content around the user\u2019s primary objective"
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-actionability-and-specificity
  name: Actionability and Specific Detail
  version: '1.0'
  description: Measures how concretely a response enables immediate execution by providing
    steps, commands, code, or examples. Higher scores indicate precise, ordered instructions
    and runnable snippets with clear parameters and assumptions. Lower scores reflect
    vague guidance without clear next actions.
  scoring_description: Score how well the response demonstrates actionability and
    specific detail
  definition: Measures how concretely a response enables immediate execution by providing
    steps, commands, code, or examples. Higher scores indicate precise, ordered instructions
    and runnable snippets with clear parameters and assumptions. Lower scores reflect
    vague guidance without clear next actions.
  criteria:
  - range: [0.0, 0.9]
    label: Not Actionable
    indicators:
    - Provides no steps, commands, or examples the user can execute.
    - "Advice is abstract or generic (e.g., \u201Clook into X\u201D) with no next\
      \ actions."
    - User cannot determine what to do first or how to proceed.
  - range: [1.0, 1.9]
    label: Slightly Actionable
    indicators:
    - Mentions relevant tools or high-level actions but lacks procedure or ordering.
    - Missing concrete details (syntax, file paths, parameters) needed to act.
    - Requires substantial additional research to translate into steps.
  - range: [2.0, 2.9]
    label: Partially Actionable
    indicators:
    - Includes an outline or partial steps with some specifics, but key details are
      absent (e.g., incomplete commands or code).
    - Examples use placeholders without guidance on how to obtain or replace them.
    - User can begin the task but must fill multiple gaps to make it work.
  - range: [3.0, 3.9]
    label: Mostly Actionable
    indicators:
    - Provides ordered steps and concrete commands/code that work with minor adaptation
      (e.g., set one variable, install one prerequisite).
    - Specifies key parameters, file names, or expected inputs/outputs.
    - Notes main assumptions or prerequisites, with only small gaps remaining.
  - range: [4.0, 4.0]
    label: Fully Actionable
    indicators:
    - End-to-end, copy-pasteable commands or runnable code with precise syntax and
      clearly labeled parameters/placeholders.
    - Includes prerequisites, environment/setup, verification steps, and expected
      results.
    - Anticipates common pitfalls or variants and provides troubleshooting or alternatives.
  guidelines:
  - Includes executable code, commands, or step-by-step instructions
  - Specifies parameters, values, and exact paths or settings where appropriate
  - Provides examples that map directly to the task
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-completeness-of-solution
  name: Completeness of the Solution
  version: '1.0'
  description: Measures how fully the response covers the steps, prerequisites, dependencies,
    and deliverables required to achieve the user's goal. Judges whether the user
    can execute the solution end-to-end without significant additional research or
    reconstruction. Higher scores reflect complete, actionable coverage that anticipates
    typical gaps.
  scoring_description: Score how well the response demonstrates completeness of the
    solution
  definition: Measures how fully the response covers the steps, prerequisites, dependencies,
    and deliverables required to achieve the user's goal. Judges whether the user
    can execute the solution end-to-end without significant additional research or
    reconstruction. Higher scores reflect complete, actionable coverage that anticipates
    typical gaps.
  criteria:
  - range: [0.0, 0.9]
    label: Absent
    indicators:
    - Misses core requirements; provides no usable steps or deliverables.
    - Content is off-target or contradicts the task, preventing any progress.
    - Omits prerequisites/dependencies entirely so the user cannot begin.
  - range: [1.0, 1.9]
    label: Sparse
    indicators:
    - Touches on the task but omits critical steps or dependencies needed to achieve
      the outcome.
    - Provides only high-level or vague guidance with no actionable deliverables.
    - User must perform extensive external research to proceed.
  - range: [2.0, 2.9]
    label: Partial
    indicators:
    - Covers some key steps but leaves major gaps (e.g., missing setup, configuration,
      or finalization).
    - Includes partial code/commands/examples that are not runnable as-is or lack
      required inputs/context.
    - User can start but must supply substantial missing pieces to complete the task.
  - range: [3.0, 3.9]
    label: Mostly Complete
    indicators:
    - Provides most prerequisites, steps, and primary deliverables; generally actionable
      end-to-end.
    - Only minor gaps or unstated assumptions remain, requiring small follow-up or
      troubleshooting.
    - Includes runnable or directly usable elements for the main path but limited
      coverage of variants/edge cases.
  - range: [4.0, 4.0]
    label: Comprehensive
    indicators:
    - 'End-to-end coverage: prerequisites, setup, steps, and final deliverables are
      explicit and actionable.'
    - States assumptions/parameters and includes validation/verification steps and
      common pitfalls or alternatives.
    - Deliverables are immediately usable (e.g., runnable code/commands, exact configurations)
      with minimal to no additional work.
  guidelines:
  - Covers prerequisites and all key steps end-to-end
  - Addresses common edge cases or failure modes
  - Minimizes need for additional information to finish the task
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-context-tailoring-and-assumptions
  name: Context Tailoring and Assumption Handling
  version: '1.0'
  description: "Evaluates how well a response adapts recommendations to the user\u2019\
    s stated environment and constraints, and how responsibly it handles missing details.\
    \ Strong responses make relevant assumptions explicit, provide conditional paths\
    \ or alternatives, and enable progress while clarifying unknowns. Weak responses\
    \ ignore context, rely on hidden or incorrect assumptions, or ask for clarification\
    \ without offering interim value."
  scoring_description: Score how well the response demonstrates context tailoring
    and assumption handling
  definition: "Evaluates how well a response adapts recommendations to the user\u2019\
    s stated environment and constraints, and how responsibly it handles missing details.\
    \ Strong responses make relevant assumptions explicit, provide conditional paths\
    \ or alternatives, and enable progress while clarifying unknowns. Weak responses\
    \ ignore context, rely on hidden or incorrect assumptions, or ask for clarification\
    \ without offering interim value."
  criteria:
  - range: [0.0, 0.9]
    label: Not Tailored
    indicators:
    - Contradicts or ignores stated context/constraints (e.g., recommends tools/platforms
      the user cannot use).
    - Relies on unstated or incorrect assumptions presented as facts, leading to unusable
      or misleading guidance.
    - Provides one-size-fits-all steps with no acknowledgement of missing information
      or environment specifics.
  - range: [1.0, 1.9]
    label: Minimal
    indicators:
    - "Gives generic, boilerplate advice with little to no adaptation to the user\u2019\
      s environment."
    - Requests clarification but offers no provisional steps, options, or assumptions
      to keep the user moving.
    - Does not state assumptions or identify what details are missing and why they
      matter.
  - range: [2.0, 2.9]
    label: Partial
    indicators:
    - References at least one user-specific detail but remains largely generic or
      mismatched in places.
    - Assumptions are implicit or only partly stated; uncertainties are noted superficially.
    - Provides limited conditional guidance with few or no alternatives if assumptions
      prove wrong.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Adapts guidance to the stated environment/constraints and avoids conflicting
      recommendations.
    - Explicitly states key assumptions or missing details and supplies conditional
      steps based on them.
    - Offers practical alternatives for common variations (e.g., platform/language
      options) with minor gaps remaining.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - "Fully aligns with the user\u2019s context/constraints and delivers immediately\
      \ actionable, tailored steps or answers."
    - Clearly enumerates assumptions and unknowns, justifies sensible defaults, and
      provides branched paths for likely scenarios.
    - Anticipates context-specific pitfalls or edge cases and specifies what additional
      information would refine the solution without blocking progress.
  guidelines:
  - States relevant assumptions explicitly and keeps them reasonable
  - Adapts guidance to stated constraints (platform, tools, skill level)
  - Asks focused clarification questions while offering interim next steps
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-organization-for-immediate-application
  name: Organization for Immediate Application
  version: '1.0'
  description: Measures how clearly a response is structured so a user can act on
    it immediately, independent of length. Emphasizes scannability, sequencing, prioritization,
    and labeling that reduce cognitive load and enable swift execution.
  scoring_description: Score how well the response demonstrates organization for immediate
    application
  definition: Measures how clearly a response is structured so a user can act on it
    immediately, independent of length. Emphasizes scannability, sequencing, prioritization,
    and labeling that reduce cognitive load and enable swift execution.
  criteria:
  - range: [0.0, 0.9]
    label: Disorganized
    indicators:
    - Unstructured text with no logical sequence (no steps, headings, or lists).
    - Critical actions are buried or mixed with background; the user must infer the
      workflow.
    - Ambiguities or undefined terms block immediate execution.
  - range: [1.0, 1.9]
    label: Minimally Organized
    indicators:
    - Some relevant points present but scattered; no clear order of operations.
    - Long paragraphs or mixed topics without prioritization, labels, or separations.
    - Requires substantial effort to extract steps, inputs, or outputs.
  - range: [2.0, 2.9]
    label: Partially Organized
    indicators:
    - Some structure (e.g., bullets or brief sections) but steps are incomplete, vague,
      or out of order.
    - Inputs, parameters, or prerequisites are mentioned but not clearly labeled or
      grouped.
    - Guidance is mixed with commentary; user must fill notable gaps to act.
  - range: [3.0, 3.9]
    label: Well Organized
    indicators:
    - Clear sequence of actionable steps (e.g., numbered list) with concise labels.
    - Related information is grouped (prerequisites, commands/examples, alternatives)
      and easy to scan.
    - Minor omissions (e.g., edge cases or expected results) remain, but the user
      can proceed immediately.
  - range: [4.0, 4.0]
    label: Optimized for Immediate Use
    indicators:
    - 'Task-ready layout: brief objective, prerequisites, and prioritized numbered
      steps with labeled commands/placeholders.'
    - Decision points and common pitfalls are called out; expected outcomes or verification
      checks are included.
    - Minimal cognitive load through consistent terminology and concise sections that
      enable instant execution without rework.
  guidelines:
  - Uses ordered steps and clear sectioning (prerequisites, steps, verification)
  - Labels parameters, inputs, and outputs for copy-paste readiness
  - Prioritizes actions and highlights critical warnings or choices
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-correctness-judge-requirement-coverage
  name: Requirement Coverage & Constraint Compliance
  version: '1.0'
  description: Assesses whether the response fulfills every explicit task, detail,
    and constraint stated in the prompt by enumerating requirements and mapping each
    to the output. Verifies presence, format, sequencing, limits, and prohibitions,
    marking any missing, incorrect, or non-compliant elements. Partial fulfillment
    is treated as incomplete; any missing or violated requirement reduces the score.
  scoring_description: Score how well the response demonstrates requirement coverage
    & constraint compliance
  definition: Assesses whether the response fulfills every explicit task, detail,
    and constraint stated in the prompt by enumerating requirements and mapping each
    to the output. Verifies presence, format, sequencing, limits, and prohibitions,
    marking any missing, incorrect, or non-compliant elements. Partial fulfillment
    is treated as incomplete; any missing or violated requirement reduces the score.
  criteria:
  - range: [0.0, 0.9]
    label: No Coverage
    indicators:
    - Addresses fewer than 10% of explicit requirements; core task not attempted or
      off-topic.
    - Multiple critical constraints violated (e.g., banned tools/languages used, wrong
      output type) or responds to a different task.
    - Most required outputs/sections absent.
  - range: [1.0, 1.9]
    label: Minimal Coverage
    indicators:
    - Addresses about 10-39% of explicit requirements; most core tasks missing or
      delivered in the wrong form.
    - At least one major constraint breach (e.g., format/length/step-order/tool restrictions)
      that makes the response unusable as-is.
    - Several required elements or steps omitted.
  - range: [2.0, 2.9]
    label: Partial Coverage
    indicators:
    - Addresses about 40-69% of explicit requirements; at least one major required
      component/output is missing.
    - Some constraints met, but notable lapses remain (e.g., incorrect format/units,
      exceeds limits, missing mandatory sections).
    - Delivers only a subset of required outputs or misorders mandatory steps.
  - range: [3.0, 3.9]
    label: Substantial Coverage
    indicators:
    - Addresses about 70-99% of explicit requirements; only minor elements are missing
      or slightly off-spec.
    - All major constraints satisfied; any deviations are minor and do not impede
      use (e.g., small formatting variance or slight length drift).
    - All primary outputs present in the requested form; edge-case or ancillary details
      may be incomplete.
  - range: [4.0, 4.0]
    label: Complete Coverage
    indicators:
    - Satisfies 100% of explicit requirements with no omissions or substitutions.
    - Fully compliant with all stated constraints (formats, steps, limits, tools/APIs,
      language/safety rules).
    - Outputs are complete, correctly structured, and aligned to every specified detail,
      including conditional branches and edge cases.
  guidelines:
  - All requested outputs/steps are present and complete
  - Specified constraints (formats, limits, data fields) are followed
  - No required element is omitted or replaced with an unrelated item
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-correctness-judge-factual-accuracy
  name: Factual Claim Accuracy & Precision
  version: '1.0'
  description: Measures whether all factual claims, values, and conclusions are true,
    precise, and non-misleading relative to the prompt and widely accepted knowledge.
    Checks correctness of numbers, definitions, entities, and causal implications,
    and whether uncertainty is properly acknowledged when applicable.
  scoring_description: Score how well the response demonstrates factual claim accuracy
    & precision
  definition: Measures whether all factual claims, values, and conclusions are true,
    precise, and non-misleading relative to the prompt and widely accepted knowledge.
    Checks correctness of numbers, definitions, entities, and causal implications,
    and whether uncertainty is properly acknowledged when applicable.
  criteria:
  - range: [0.0, 0.9]
    label: Completely Incorrect
    indicators:
    - Most claims contradict the prompt or authoritative knowledge, or are irrelevant
      to the task.
    - Core conclusions rely on impossible or non-existent facts, entities, tools,
      or relationships.
    - Precision is grossly wrong (e.g., wrong units/dates/identities) with no acknowledgment
      of uncertainty, making the response unusable.
  - range: [1.0, 1.9]
    label: Mostly Inaccurate
    indicators:
    - Multiple major factual errors or contradictions; only isolated elements are
      correct.
    - Several hallucinated or fabricated specifics (e.g., invented data/APIs) presented
      as fact.
    - Missing qualifiers/units or imprecise wording materially distorts meaning or
      outcomes.
  - range: [2.0, 2.9]
    label: Partially Accurate
    indicators:
    - Mix of correct and incorrect claims; at least one material inaccuracy or several
      minor ones that could mislead.
    - Relies on unsupported assumptions or vague assertions where specific facts are
      needed.
    - Numbers/definitions partly right but with notable errors in magnitude, scope,
      or qualifiers affecting some interpretations.
  - range: [3.0, 3.9]
    label: Mostly Accurate
    indicators:
    - All core claims are correct; only minor imprecision (e.g., small rounding or
      generic naming) that does not affect conclusions.
    - No material hallucinations; any assumptions are reasonable and consistent with
      the prompt.
    - Minor omissions in precision (units/qualifiers) but context keeps statements
      non-misleading.
  - range: [4.0, 4.0]
    label: Fully Accurate
    indicators:
    - Every factual claim, number, definition, and reference is correct and verifiable
      from the prompt or authoritative sources.
    - No unsupported assumptions or hallucinated specifics; uncertainty is explicitly
      and appropriately stated when relevant.
    - Statements are precise (correct units, dates, names, scopes, API behavior) and
      non-misleading throughout.
  guidelines:
  - Claims align with verifiable facts or given context
  - Numerical results and derived outputs are correct
  - No misleading implications, conflations, or overgeneralizations
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-correctness-judge-grounding-and-non-hallucination
  name: "Grounding & Non\u2011Hallucination"
  version: '1.0'
  description: Assesses whether the response anchors its claims to the provided context
    or to widely accepted general knowledge, avoiding invented specifics. Rewards
    explicit acknowledgment of uncertainty and cautious generalization, while penalizing
    ungrounded details, fabricated citations, or overconfident speculation. Focuses
    on support versus invention (grounding), not on factual accuracy alone.
  scoring_description: "Score how well the response demonstrates grounding & non\u2011\
    hallucination"
  definition: Assesses whether the response anchors its claims to the provided context
    or to widely accepted general knowledge, avoiding invented specifics. Rewards
    explicit acknowledgment of uncertainty and cautious generalization, while penalizing
    ungrounded details, fabricated citations, or overconfident speculation. Focuses
    on support versus invention (grounding), not on factual accuracy alone.
  criteria:
  - range: [0.0, 0.9]
    label: Unfounded
    indicators:
    - 'Predominantly hallucinated: key claims lack support or contradict the provided
      context.'
    - Relies on non-existent entities, sources, data, or APIs as central elements.
    - Shows no use of or alignment with the given context; content is essentially
      made up.
  - range: [1.0, 1.9]
    label: Mostly Ungrounded
    indicators:
    - Frequent unsupported specifics (names, numbers, dates) not in the context or
      common knowledge.
    - Speculation is presented as certain; includes fabricated references/examples.
    - Materially diverges from or ignores relevant context when making claims.
  - range: [2.0, 2.9]
    label: Partially Grounded
    indicators:
    - Mix of grounded and ungrounded content; some specific details are added without
      support.
    - Speculative inferences appear with weak or missing hedging.
    - Occasionally overlooks or loosely interprets the provided context.
  - range: [3.0, 3.9]
    label: Mostly Grounded
    indicators:
    - Core claims are supported by the context or common knowledge; only minor unstated
      generalities.
    - No fabricated entities or sources; small extrapolations are clearly hedged.
    - Avoids introducing specific unsupported numbers/names; background knowledge
      use is appropriate.
  - range: [4.0, 4.0]
    label: Fully Grounded
    indicators:
    - All concrete details are supported by the prompt/context or widely accepted
      knowledge; no new specific facts invented.
    - Uncertainties and gaps are explicitly acknowledged; no speculation presented
      as fact.
    - No fabricated sources, quotes, statistics, APIs, or entities.
  guidelines:
  - No fabricated entities, data points, APIs, or citations
  - Assumptions are explicitly labeled and not presented as facts
  - References to context are faithful and not extrapolated beyond evidence
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-correctness-judge-procedural-correctness
  name: Procedural/Computational Correctness
  version: '1.0'
  description: Evaluates whether methods, algorithms, calculations, and code are technically
    valid and produce correct results for the stated task. Checks logical soundness
    of steps, correct use of APIs/libraries (names, signatures, parameter semantics),
    and accuracy across typical and edge cases. Minor syntactic nits are acceptable;
    logical, feasibility, or semantic errors are not.
  scoring_description: Score how well the response demonstrates procedural/computational
    correctness
  definition: Evaluates whether methods, algorithms, calculations, and code are technically
    valid and produce correct results for the stated task. Checks logical soundness
    of steps, correct use of APIs/libraries (names, signatures, parameter semantics),
    and accuracy across typical and edge cases. Minor syntactic nits are acceptable;
    logical, feasibility, or semantic errors are not.
  criteria:
  - range: [0.0, 0.9]
    label: Completely Incorrect
    indicators:
    - Procedure is irrelevant or incoherent; cannot produce the requested outcome.
    - Relies on fabricated/non-existent entities or impossible math/operations.
    - No valid API/function usage; outputs (if any) are demonstrably wrong.
  - range: [1.0, 1.9]
    label: Mostly Incorrect
    indicators:
    - Core method is unsuitable or misapplied; key steps are invalid or infeasible.
    - Uses wrong or non-existent APIs/signatures as central steps; code would not
      run or compile.
    - Results are largely incorrect or missing; violates stated constraints.
  - range: [2.0, 2.9]
    label: Partially Correct
    indicators:
    - General approach aligns with the task but contains a major logical error or
      multiple nontrivial mistakes.
    - API/function usage shows misunderstandings (e.g., wrong signature/types or parameter
      semantics), though some calls are valid.
    - Produces incomplete or partly correct results; fails on typical edge cases or
      provided tests.
  - range: [3.0, 3.9]
    label: Mostly Correct
    indicators:
    - Core logic/algorithm is correct; only minor, easily fixed issues (e.g., trivial
      syntax, off-by-one, formatting).
    - "APIs/libraries are appropriate with at most minor parameter/name imprecision\
      \ that\u2019s trivially correctable."
    - Correct for main cases; may miss a rare edge case or minor rounding/format detail
      without altering the method.
  - range: [4.0, 4.0]
    label: Fully Correct
    indicators:
    - Algorithm/procedure is logically sound end-to-end and matches problem requirements
      and constraints.
    - Uses valid APIs/libraries with correct names, signatures, types, and parameter
      semantics; feasible and reproducible.
    - Produces correct results (including stated edge cases) with numerically accurate
      outputs within declared tolerances; code is ready-to-run in a standard environment.
  guidelines:
  - Code uses valid functions/APIs and would run with trivial or no fixes
  - Mathematical steps and algorithmic logic yield correct results
  - Outputs are consistent with the described method and inputs
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-correctness-judge-uncertainty-handling
  name: Uncertainty & Unknowns Handling
  version: '1.0'
  description: This rubric measures how well a response handles uncertainty, missing
    data, and probabilistic or future-dependent claims. It rewards clear qualification,
    appropriate confidence calibration, and explicit assumptions, and penalizes unwarranted
    certainty or invented specifics. It focuses on whether unknowns are acknowledged
    and bounded rather than ignored.
  scoring_description: Score how well the response demonstrates uncertainty & unknowns
    handling
  definition: This rubric measures how well a response handles uncertainty, missing
    data, and probabilistic or future-dependent claims. It rewards clear qualification,
    appropriate confidence calibration, and explicit assumptions, and penalizes unwarranted
    certainty or invented specifics. It focuses on whether unknowns are acknowledged
    and bounded rather than ignored.
  criteria:
  - range: [0.0, 0.9]
    label: Poor
    indicators:
    - States speculative or future outcomes as facts and provides precise figures/dates
      without support.
    - Ignores missing data or known uncertainty; fabricates details to fill gaps.
    - Offers no caveats, assumptions, or limitations where they are necessary.
  - range: [1.0, 1.9]
    label: Weak
    indicators:
    - "Uses vague hedges (e.g., \u201Cprobably\u201D) but makes key claims with unwarranted\
      \ certainty."
    - Gives single-point estimates with no context, basis, or error bounds.
    - Omits major assumptions or known unknowns relevant to the answer.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Acknowledges some uncertainty but misses one or more critical caveats or limitations.
    - Mixes qualified language with occasional unsupported specifics (e.g., overly
      narrow ranges or confident tone).
    - Partially separates facts from speculation but blurs the boundary in places.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Clearly identifies unknowns and conditions key claims on stated assumptions.
    - Provides ranges, scenarios, or probability qualifiers appropriate to the evidence;
      avoids invented specifics.
    - Only minor lapses in calibration or missing caveats that do not materially mislead.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Consistently distinguishes facts, estimates, and unknowns; explicitly states
      relevant assumptions and data limits.
    - Calibrates confidence with appropriate ranges/probabilities and briefly explains
      the basis or evidence.
    - Avoids asserting beyond available evidence and, when useful, suggests ways to
      obtain missing information.
  guidelines:
  - Acknowledges when data is unavailable or inherently uncertain
  - States assumptions and limits clearly for predictions/estimates
  - Uses ranges or conditional phrasing where exact facts are unknown
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-coherence-judge-logical-flow-and-sequencing
  name: Logical Flow & Sequencing
  version: '1.0'
  description: Measures how clearly and logically ideas progress from start to finish,
    with attention to ordered sequencing and smooth transitions. Evaluates whether
    the response presents a clear beginning, middle, and end without disjoint jumps
    that force the reader to backtrack.
  scoring_description: Score how well the response demonstrates logical flow & sequencing
  definition: Measures how clearly and logically ideas progress from start to finish,
    with attention to ordered sequencing and smooth transitions. Evaluates whether
    the response presents a clear beginning, middle, and end without disjoint jumps
    that force the reader to backtrack.
  criteria:
  - range: [0.0, 0.9]
    label: Chaotic
    indicators:
    - No discernible beginning, middle, and end; content feels unordered.
    - Ideas or steps appear out of sequence with abrupt, unexplained jumps.
    - Reader must repeatedly backtrack to connect points.
  - range: [1.0, 1.9]
    label: Disjointed
    indicators:
    - Weak or inconsistent structure; sections are misgrouped or partially shuffled.
    - Transitions are missing or misleading, causing confusion about how points relate.
    - Frequent sequencing errors force the reader to re-interpret earlier parts.
  - range: [2.0, 2.9]
    label: Partial Order
    indicators:
    - Basic opening/body/closing exists but ordering is suboptimal with occasional
      jumps.
    - Some transitions or signposts are present, yet gaps require the reader to fill
      in links.
    - A few instances of mild backtracking or re-reading to follow the progression.
  - range: [3.0, 3.9]
    label: Well-Ordered
    indicators:
    - Clear overall progression where most ideas build on prior points in a sensible
      order.
    - Transitions generally guide the reader; only minor rough spots or brief tangents.
    - Beginning, middle, and end are evident with little to no backtracking needed.
  - range: [4.0, 4.0]
    label: Seamless
    indicators:
    - Strong opening frames the path; body proceeds in a clean, logical sequence;
      closing consolidates the message.
    - Smooth, purposeful transitions make relationships explicit and eliminate ambiguity.
    - No disjoint jumps or reordering; the reader moves forward without needing to
      backtrack.
  guidelines:
  - Each sentence/point follows logically from the previous one
  - Uses signposting or transitions to connect steps or sections
  - Avoids abrupt topic shifts or unexplained jumps
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-coherence-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: coherence
- id: helpsteer2-coherence-judge-internal-consistency
  name: Internal Consistency
  version: '1.0'
  description: "Assesses whether the response maintains a stable stance without contradicting\
    \ itself. It checks for mutually incompatible statements, reversals, or conflicting\
    \ details (e.g., terms, numbers, conditions). Contradictions are weighed heavily\
    \ regardless of the response\u2019s correctness or usefulness."
  scoring_description: Score how well the response demonstrates internal consistency
  definition: "Assesses whether the response maintains a stable stance without contradicting\
    \ itself. It checks for mutually incompatible statements, reversals, or conflicting\
    \ details (e.g., terms, numbers, conditions). Contradictions are weighed heavily\
    \ regardless of the response\u2019s correctness or usefulness."
  criteria:
  - range: [0.0, 0.9]
    label: Completely Inconsistent
    indicators:
    - Multiple direct contradictions or mutually incompatible claims on core points.
    - Later statements explicitly reverse or negate earlier statements without acknowledgement.
    - Conflicting figures/conditions (e.g., different numbers, definitions, or constraints)
      appear for the same item.
  - range: [1.0, 1.9]
    label: Mostly Inconsistent
    indicators:
    - At least one clear contradiction on a major point that undermines the overall
      message.
    - Key terms, variables, or criteria shift meaning mid-response without explanation.
    - Important numbers, assumptions, or rules change inconsistently across sections.
  - range: [2.0, 2.9]
    label: Some Inconsistencies
    indicators:
    - Main stance is identifiable but contains minor conflicting statements or unresolved
      qualifiers.
    - Small numerical/detail mismatches (e.g., counts, thresholds) that create localized
      inconsistency.
    - "Occasional conditional claims that don\u2019t align perfectly with later statements."
  - range: [3.0, 3.9]
    label: Mostly Consistent
    indicators:
    - No substantive contradictions; overall stance and conclusions align.
    - Terminology, variables, and figures are largely consistent; only minor wording
      could be read ambiguously.
    - Caveats and conditions remain compatible with subsequent statements.
  - range: [4.0, 4.0]
    label: Perfectly Consistent
    indicators:
    - All statements reinforce a single, stable stance with zero contradictions or
      reversals.
    - Terminology, variables, and quantitative details remain uniform throughout.
    - Qualifiers and conditions are applied consistently, and later parts build on
      earlier points without conflict.
  guidelines:
  - No claims that conflict with earlier assertions or conditions
  - Stable stance and recommendations throughout
  - No mixed directives (e.g., advising both to do and not do something)
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-coherence-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: coherence
- id: helpsteer2-coherence-judge-referential-clarity-and-terminology
  name: Referential Clarity & Terminology
  version: '1.0'
  description: Assesses how clearly and consistently an answer refers to entities,
    variables, acronyms, and terms so that references are unambiguous. Evaluates whether
    pronouns have clear antecedents, terms and symbols are defined and used consistently,
    and wording changes do not shift meaning. Minor stylistic variation is acceptable
    when the intended referent remains unmistakable.
  scoring_description: Score how well the response demonstrates referential clarity
    & terminology
  definition: Assesses how clearly and consistently an answer refers to entities,
    variables, acronyms, and terms so that references are unambiguous. Evaluates whether
    pronouns have clear antecedents, terms and symbols are defined and used consistently,
    and wording changes do not shift meaning. Minor stylistic variation is acceptable
    when the intended referent remains unmistakable.
  criteria:
  - range: [0.0, 0.9]
    label: Completely Unclear
    indicators:
    - Pronouns or references lack antecedents or have multiple unresolved candidates,
      making mapping impossible.
    - Terms/symbols change meaning mid-response or contradict earlier usage.
    - Inconsistent or incorrect naming (e.g., variables, acronyms) prevents understanding
      of what refers to what.
  - range: [1.0, 1.9]
    label: Mostly Unclear
    indicators:
    - Frequent ambiguous pronouns/references; readers must guess the intended entity.
    - Terminology or symbols switch labels or meanings in ways that cause sustained
      confusion.
    - Key acronyms/variables introduced without definition and used inconsistently.
  - range: [2.0, 2.9]
    label: Somewhat Clear
    indicators:
    - Several ambiguous or weakly specified references that require effort or backtracking
      to resolve.
    - At least one instance of inconsistent terminology or symbol reuse that creates
      momentary uncertainty.
    - Some terms/acronyms are undefined or renamed later, though the intended meaning
      can usually be inferred.
  - range: [3.0, 3.9]
    label: Mostly Clear
    indicators:
    - Pronouns and variables have clear antecedents with only minor, easily resolvable
      ambiguities.
    - Terminology, acronyms, and symbols are largely consistent; any variation (e.g.,
      synonyms) does not shift meaning.
    - Nonstandard terms are defined or evident from context; disambiguation is used
      when similar entities appear.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - All pronouns, variables, and cross-references have unambiguous antecedents;
      no competing candidates.
    - Terms, acronyms, and symbols are defined when needed and used consistently with
      no unexplained switches.
    - Multiple similar entities are clearly distinguished with precise labels or qualifiers
      throughout.
  guidelines:
  - Pronouns have clear antecedents; variables/symbols are used consistently
  - Terminology remains stable or changes are explicitly signaled
  - Avoids vague deictics (this/that/it) when multiple candidates exist
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-coherence-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: coherence
- id: helpsteer2-coherence-judge-concision-and-non-redundancy
  name: Concision & Non-Redundancy
  version: '1.0'
  description: "Measures how efficiently the response communicates without unnecessary\
    \ repetition or filler. Assesses whether each sentence adds new value, avoids\
    \ duplicating prior content, and omits tangents or boilerplate that do not advance\
    \ the point. Correctness is not judged\u2014only brevity, lack of duplication,\
    \ and whether redundancy impairs flow."
  scoring_description: Score how well the response demonstrates concision & non-redundancy
  definition: "Measures how efficiently the response communicates without unnecessary\
    \ repetition or filler. Assesses whether each sentence adds new value, avoids\
    \ duplicating prior content, and omits tangents or boilerplate that do not advance\
    \ the point. Correctness is not judged\u2014only brevity, lack of duplication,\
    \ and whether redundancy impairs flow."
  criteria:
  - range: [0.0, 0.9]
    label: Severely Redundant
    indicators:
    - Verbatim or near-verbatim sentences/paragraphs are duplicated, or the text loops
      back to the same point repeatedly.
    - Large portions are filler (e.g., long prefaces, disclaimers, tangents) that
      do not advance the task.
    - Redundancy overwhelms the message; core content is hard to locate or follow.
  - range: [1.0, 1.9]
    label: Mostly Redundant
    indicators:
    - Same ideas or instructions are restated multiple times with minor rephrasing.
    - Noticeable nonessential content (e.g., extended meta-commentary, unnecessary
      examples) inflates length.
    - Redundancy disrupts flow, causing the reader to skim past repeated material.
  - range: [2.0, 2.9]
    label: Some Redundancy
    indicators:
    - Occasional repetition or recap reiterates earlier points instead of synthesizing
      them.
    - Some filler words/phrases or verbose constructions that could be tightened without
      loss of meaning.
    - Slightly longer than necessary; redundancy mildly affects pacing but main points
      remain clear.
  - range: [3.0, 3.9]
    label: Mostly Concise
    indicators:
    - Minimal repetition; any brief recap is purposeful and adds clarity (e.g., short
      summary without restating details).
    - Little to no filler or tangents; wording is generally tight and focused on the
      task.
    - Length is appropriate; minor verbosity does not impede flow.
  - range: [4.0, 4.0]
    label: Optimal Concision
    indicators:
    - No unnecessary repetition; each sentence contributes new, relevant information.
    - Zero filler or irrelevant meta-commentary; phrasing is compact without sacrificing
      clarity.
    - If present, summaries are succinct and non-duplicative, clearly enhancing comprehension.
  guidelines:
  - No repeated points or steps without added value
  - Each sentence advances the message; minimal filler or looping text
  - No verbose restatements that obscure the main idea
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-coherence-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: coherence
- id: helpsteer2-coherence-judge-structure-and-formatting-support
  name: Structure & Formatting Support
  version: '1.0'
  description: "Assesses how well the response\u2019s structure and formatting (headings,\
    \ lists, tables, code blocks) make the content easier to read and follow. Rewards\
    \ clear, consistent organization that supports comprehension and task execution,\
    \ and penalizes broken, inconsistent, or misleading formatting. Stylistic choices\
    \ are not penalized if the structure remains functionally clear and coherent."
  scoring_description: Score how well the response demonstrates structure & formatting
    support
  definition: "Assesses how well the response\u2019s structure and formatting (headings,\
    \ lists, tables, code blocks) make the content easier to read and follow. Rewards\
    \ clear, consistent organization that supports comprehension and task execution,\
    \ and penalizes broken, inconsistent, or misleading formatting. Stylistic choices\
    \ are not penalized if the structure remains functionally clear and coherent."
  criteria:
  - range: [0.0, 0.9]
    label: Completely Broken
    indicators:
    - Formatting errors render content hard to parse (e.g., mangled or nested lists,
      unclosed code fences, misaligned tables).
    - Structure misleads or contradicts content (e.g., mislabeled sections/steps,
      headings that do not match the text).
    - Intrusive or chaotic layout (random line breaks, repeated blocks) fragments
      the message and obscures flow.
  - range: [1.0, 1.9]
    label: Mostly Deficient
    indicators:
    - Disorganized or inconsistent structure (abrupt list level changes, missing or
      illogical headings).
    - Frequent formatting inaccuracies that impede reading (misnumbered steps, mixed
      bullet styles, uneven indentation).
    - Misuse of structural elements (e.g., code blocks for prose or tables for simple
      lists) that creates confusion.
  - range: [2.0, 2.9]
    label: Partially Effective
    indicators:
    - Basic structure present (some headings/lists), but ordering or grouping is suboptimal
      and requires reader effort.
    - Occasional inconsistencies or minor errors (e.g., a mislabeled step or uneven
      spacing) that mildly hinder clarity.
    - Some helpful formatting coexists with unnecessary or distracting elements (e.g.,
      redundant sections or overly long blocks).
  - range: [3.0, 3.9]
    label: Effective
    indicators:
    - Clear, logical organization with consistent headings and correctly formatted
      lists/code that support the message.
    - Formatting aids skimming and execution (concise sections, sensible step order)
      with minimal distraction.
    - No substantive structural errors; stylistic variations are consistent and do
      not impede understanding.
  - range: [4.0, 4.0]
    label: Exemplary
    indicators:
    - Purposeful, well-scoped structure (descriptive headings, well-ordered steps,
      correctly scoped code/examples) that enhances comprehension.
    - Consistent, unambiguous conventions (numbering, bullets, labels, references)
      with precise alignment between structure and content.
    - Formatting anticipates reader needs (e.g., brief summaries, callouts, or tables
      where appropriate) without redundancy or clutter.
  guidelines:
  - Lists/steps are complete, parallel, and properly ordered
  - Headings and grouping align with the logical structure
  - No broken or mangled formatting that hinders readability
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-coherence-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: coherence
- id: helpsteer2-complexity-judge-lexical-sophistication
  name: Vocabulary Sophistication
  version: '1.0'
  description: Measures the breadth and rarity of word choice, emphasizing abstraction
    and nominalization beyond everyday lexicon. Ratings are anchored to proportions
    of low-frequency content words (Zipf bands) and nominalizations per 100 words,
    calibrated with CEFR vocabulary bands. This rubric assesses lexical sophistication,
    not correctness or clarity.
  scoring_description: Score how well the response demonstrates vocabulary sophistication
  definition: Measures the breadth and rarity of word choice, emphasizing abstraction
    and nominalization beyond everyday lexicon. Ratings are anchored to proportions
    of low-frequency content words (Zipf bands) and nominalizations per 100 words,
    calibrated with CEFR vocabulary bands. This rubric assesses lexical sophistication,
    not correctness or clarity.
  criteria:
  - range: [0.0, 0.9]
    label: Basic
    indicators:
    - "CEFR mostly A1-A2; low-frequency content tokens (Zipf < 3.5) \u2264 2%; nominalizations\
      \ \u2264 1 per 100 words."
    - Vocabulary is concrete and everyday (e.g., get, make, fix, thing), avoiding
      Latinate/technical words and abstract nouns.
  - range: [1.0, 1.9]
    label: Simple
    indicators:
    - "CEFR largely A1-B1; low-frequency content tokens (Zipf < 3.5) 2\u20135%; nominalizations\
      \ 1\u20132 per 100 words."
    - Occasional mildly specific words but prefers basic phrasal verbs over single-word
      Latinate alternatives (e.g., set up vs configure; help vs assistance).
  - range: [2.0, 2.9]
    label: Intermediate
    indicators:
    - "Mix of A2-B2 with some C1; low-frequency content tokens (Zipf < 3.5) 5\u2013\
      10%; nominalizations 2\u20134 per 100 words."
    - Regular use of mid-level abstract/technical terms and some Latinate choices
      (e.g., configure, parameter, optimize, mitigate) with limited domain jargon.
    - Shows lexical variation via single-word verbs and precise adjectives (e.g.,
      assemble, allocate, robust) instead of only basic verbs.
  - range: [3.0, 3.9]
    label: Advanced
    indicators:
    - "Many B2-C1 items; low-frequency content tokens (Zipf < 3.5) 10\u201318%; nominalizations\
      \ 4\u20137 per 100 words."
    - Frequent abstract/Latinate lexis and unglossed discipline terms (e.g., facilitate,
      orthogonal, granular, throughput), replacing phrasal verbs with compact verbs.
    - Preference for derived nouns (-tion, -ity, -ance) and noun phrases (e.g., implementation
      details, risk mitigation strategy).
  - range: [4.0, 4.0]
    label: Expert
    indicators:
    - Dominant C1-C2; low-frequency content tokens (Zipf < 3.5) > 18%; nominalizations
      > 7 per 100 words.
    - Dense specialized terminology and rare items used fluently without explanation
      (e.g., heteroskedasticity, manifold, epistemic status, operationalization, orthogonality).
    - Highly abstract, noun-heavy style with layered nominal compounds and precise
      qualifiers (e.g., marginal identifiability constraints; calibration monotonicity),
      minimal reliance on everyday verbs.
  guidelines:
  - High proportion of low-frequency words or advanced synonyms instead of common
    equivalents
  - Frequent nominalizations and abstract nouns (e.g., optimization, heterogeneity)
  - Preference for precise qualifiers over plain wording (e.g., necessary and sufficient,
    orthogonal)
  score_range: [0.0, 4.0]
