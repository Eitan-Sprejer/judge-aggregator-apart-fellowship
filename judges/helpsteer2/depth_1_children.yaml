judges:
- id: helpsteer2-helpfulness-judge-relevance-and-focused-delivery
  name: Relevance and Focused Delivery
  version: '1.0'
  description: "Measures how directly the response addresses the user\u2019s intent\
    \ with minimal filler and a clear, easy-to-follow structure. Prioritizes concise,\
    \ on-topic content that advances the solution without unnecessary restatement,\
    \ caveats, or digressions. Rewards orderly formatting (e.g., brief bullets or\
    \ steps) that enables rapid understanding."
  scoring_description: Score how well the response demonstrates relevance and focused
    delivery
  definition: "Measures how directly the response addresses the user\u2019s intent\
    \ with minimal filler and a clear, easy-to-follow structure. Prioritizes concise,\
    \ on-topic content that advances the solution without unnecessary restatement,\
    \ caveats, or digressions. Rewards orderly formatting (e.g., brief bullets or\
    \ steps) that enables rapid understanding."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - "Does not address the user\u2019s intent or is mostly off-topic/refusal; no\
      \ actionable progress."
    - Heavy filler or prompt regurgitation; answer buried or missing.
    - Disorganized delivery with no clear structure (wall of text or scattered points).
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Partially relevant but misses the core intent or primarily restates the question.
    - Excessive preamble, caveats, or background that delays or obscures the answer.
    - Little to no structural guidance (unordered thoughts; hard to scan).
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Addresses the main intent but mixes in noticeable filler or tangents.
    - "Answer is delayed (not given in the first 1\u20132 sentences) or requires the\
      \ reader to sift for key points."
    - Some structure present but inconsistent (e.g., partial bullets/steps) or minor
      repetition of the prompt.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Directly addresses the intent early, with mostly on-topic content and minimal
      fluff.
    - Clear, mostly well-ordered structure (concise bullets/steps) that is easy to
      scan.
    - May include brief, relevant context or a single focused clarifying question
      without derailing progress.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - "Immediately delivers the core answer in the first 1\u20132 sentences, tightly\
      \ aligned to the user\u2019s intent."
    - Crisp, well-structured layout (succinct bullets/steps) with no unnecessary restatement,
      caveats, or digressions.
    - Only includes essential context; any clarifying question is singular, brief,
      and paired with forward progress.
  guidelines:
  - Answers the core question up front and stays strictly on-topic
  - Avoids repetition and filler; organizes content for quick scanning (e.g., bullets/ordered
    steps)
  - Scopes content to the request rather than generic exposition or tangents
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-technical-correctness-and-tool-validity
  name: Technical Correctness and Tool Validity
  version: '1.0'
  description: Measures whether the response uses real, appropriate tools/APIs/commands
    with accurate facts and terminology for the stated platform or context. Checks
    feasibility against known ecosystems (e.g., correct cloud service, hypervisor,
    framework), version constraints, and prerequisites without inventing capabilities
    or endpoints. Rewards precise, runnable instructions that avoid deprecated or
    incompatible features and clearly note constraints that affect correctness.
  scoring_description: Score how well the response demonstrates technical correctness
    and tool validity
  definition: Measures whether the response uses real, appropriate tools/APIs/commands
    with accurate facts and terminology for the stated platform or context. Checks
    feasibility against known ecosystems (e.g., correct cloud service, hypervisor,
    framework), version constraints, and prerequisites without inventing capabilities
    or endpoints. Rewards precise, runnable instructions that avoid deprecated or
    incompatible features and clearly note constraints that affect correctness.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Invents or misapplies tools/APIs/commands (e.g., nonexistent endpoints, wrong
      hypervisor/framework) or impossible capabilities.
    - Contains critical factual/syntax errors that would fail immediately or risk
      damage; no acknowledgment of prerequisites or constraints.
    - Uses misleading or incorrect terminology that contradicts the task context.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Includes at least one major technical inaccuracy (e.g., wrong API resource/path,
      invalid CLI flags, mismatched platform/language).
    - Omits essential prerequisites or versions leading to nonfunctional steps; mixes
      incompatible technologies without notice.
    - Terminology shows misunderstanding of key concepts (e.g., conflating services
      or layers).
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Uses mostly plausible tools but with minor to moderate inaccuracies (e.g., outdated/deprecated
      API versions, incorrect option names) requiring user correction.
    - Assumes environment details without stating them (versions, permissions, regions),
      causing potential incompatibilities.
    - Terminology is generally correct with occasional misuse or ambiguity affecting
      precision.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Applies correct, real tools/APIs/commands for the target platform with accurate
      syntax and parameters; no hallucinated capabilities.
    - Notes key prerequisites and version/compatibility constraints that impact behavior;
      flags uncertainties or platform-specific differences when relevant.
    - Uses precise domain terminology with only minor, non-breaking omissions.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Provides fully accurate, feasible steps/code verified against real tools for
      the stated environment; parameters, endpoints, and outputs align with expected
      behavior.
    - Proactively addresses versioning, compatibility, permissions, and platform differences;
      avoids deprecated features or clearly marks them with safer alternatives.
    - Anticipates edge cases and validates assumptions (e.g., OS/edition, region,
      auth scopes), leaving no contradictions or ambiguities.
  guidelines:
  - Uses real, appropriate tools/APIs/flags for the stated platform or environment
  - Provides syntactically valid commands/code consistent with documented behavior
  - Avoids confident misinformation; notes version/compatibility constraints where
    relevant
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-completeness-and-requirements-coverage
  name: Completeness and Requirements Coverage
  version: '1.0'
  description: Measures how fully the response covers all stated requirements and
    sub-tasks in the user's request. Emphasizes inclusion of prerequisites, environment
    constraints, permissions, configurations, and relevant edge cases or failure modes
    so the solution can be executed without missing pieces.
  scoring_description: Score how well the response demonstrates completeness and requirements
    coverage
  definition: Measures how fully the response covers all stated requirements and sub-tasks
    in the user's request. Emphasizes inclusion of prerequisites, environment constraints,
    permissions, configurations, and relevant edge cases or failure modes so the solution
    can be executed without missing pieces.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Does not address the stated requirements or misinterprets the task.
    - Omits prerequisites, constraints, and environment details entirely, rendering
      steps unusable.
    - Critical contradictions or gaps prevent completion of the core task.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Addresses only a small portion of the requirements; most sub-tasks are missing.
    - Essential prerequisites/permissions/configuration steps are absent or incorrect.
    - Unaccounted constraints and failure modes would likely cause the approach to
      fail in typical scenarios.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Covers the primary goal but omits one or more important sub-requirements or
      steps.
    - Mentions few prerequisites/constraints with limited detail; edge cases largely
      ignored.
    - Gaps (e.g., missing dependencies or configuration specifics) could impede execution
      in common environments.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Addresses most requirements and sub-tasks with a generally complete workflow;
      only minor omissions.
    - Identifies key prerequisites, environment/permission needs, and some edge cases
      or failure modes.
    - Assumptions are mostly clear; remaining gaps are unlikely to block successful
      execution.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Explicitly covers all stated requirements and sub-parts with no essential steps
      or dependencies missing.
    - Thoroughly includes prerequisites, environment constraints, permissions, and
      configuration details; anticipates relevant edge cases and typical failure modes.
    - Clearly maps guidance to each requirement, states assumptions, and offers practical
      alternatives or fallbacks when constraints arise.
  guidelines:
  - Covers multi-part asks end-to-end, including prerequisites and dependencies
  - Calls out constraints, options, and common pitfalls or edge cases
  - States expected outcomes or acceptance criteria for success
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-actionability-and-specificity
  name: Actionability and Specificity
  version: '1.0'
  description: Measures how concretely and precisely the response enables the user
    to act. High scores require copy-pastable steps, code, or commands with clear
    placeholders, minimal reproducible snippets, and quick verification checks indicating
    success or failure.
  scoring_description: Score how well the response demonstrates actionability and
    specificity
  definition: Measures how concretely and precisely the response enables the user
    to act. High scores require copy-pastable steps, code, or commands with clear
    placeholders, minimal reproducible snippets, and quick verification checks indicating
    success or failure.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - No executable steps, code, or commands are provided; content is generic or purely
      descriptive.
    - Missing concrete parameters, file names, or environment details; relies on vague
      phrases (e.g., "just set it up").
    - Provides no guidance on required inputs or any way to verify success.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Includes partial or high-level steps but lacks runnable commands/snippets or
      key options needed to execute.
    - Placeholders or variables (if any) are ambiguous, undefined, or inconsistently
      used.
    - No explicit verification step or expected output to confirm the action worked.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Provides at least one concrete command or snippet, but the sequence is incomplete
      or omits prerequisite context.
    - Placeholders exist but are not clearly explained or consistently formatted;
      some values must be guessed.
    - Verification is minimal or vague (e.g., "check if it works") without specific
      checks or expected results.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Offers a mostly complete, ordered set of copy-pastable steps/commands with necessary
      flags and typical defaults.
    - Placeholders are clearly marked and briefly explained, indicating what to change
      and where to obtain values.
    - Includes at least one quick validation step with expected outcome (e.g., command
      output, status, or log line), though edge cases may be omitted.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - 'Delivers an end-to-end, reproducible workflow: numbered steps with fully copy-pastable
      commands/snippets and required prerequisites/setup.'
    - All placeholders are unambiguous and scoped (e.g., <PROJECT_ID>, ALL_CAPS),
      with guidance on acceptable values and how to obtain them.
    - 'Provides specific validation and basic troubleshooting: concrete checks with
      expected outputs plus optional rollback/cleanup or alternative path.'
  guidelines:
  - Includes step-by-step procedures or runnable snippets with well-labeled placeholders
  - Specifies key parameters/flags and example values enabling immediate execution
  - Provides validation or test steps to confirm success
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-helpfulness-judge-context-and-uncertainty-handling
  name: Context Adaptation and Uncertainty Handling
  version: '1.0'
  description: "Evaluates how well the response aligns with the user\u2019s stated\
    \ setup and constraints while transparently handling missing details, limits,\
    \ and probabilistic outcomes. Rewards concise, focused clarifying questions and\
    \ best-effort guidance that enables progress without derailing the solution."
  scoring_description: Score how well the response demonstrates context adaptation
    and uncertainty handling
  definition: "Evaluates how well the response aligns with the user\u2019s stated\
    \ setup and constraints while transparently handling missing details, limits,\
    \ and probabilistic outcomes. Rewards concise, focused clarifying questions and\
    \ best-effort guidance that enables progress without derailing the solution."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Ignores or contradicts provided context/constraints (e.g., suggests unavailable
      tools or wrong platform).
    - Presents definitive claims or instructions without acknowledging missing information,
      limits, or uncertainty.
    - Provides no clarifying questions or interim path forward, blocking progress.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - "Gives generic or mismatched advice with minimal linkage to the user\u2019s\
      \ setup."
    - Fails to note key unknowns or uncertainty; relies on unstated or shaky assumptions.
    - Asks broad or numerous questions that stall progress and offers no actionable
      interim steps.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - References some context but overlooks important constraints or makes unverified
      assumptions.
    - Mentions missing info or uncertainty without explaining impact or proposing
      defaults/workarounds.
    - Provides limited next steps; clarifying questions are partially focused or more
      than necessary.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Adapts guidance to most provided context and avoids contradicting constraints.
    - Explicitly states specific unknowns/assumptions and their effects; asks one
      or two focused questions.
    - Offers a workable path forward now, using placeholders or reasonable defaults
      until details are clarified.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Fully integrates all relevant context and edge conditions without contradiction.
    - 'Handles uncertainty transparently: labels assumptions, outlines alternatives/branches,
      and when applicable quantifies or bounds expectations.'
    - Limits questions to only critical ones and provides actionable steps with validation
      or contingency checks to proceed immediately.
  guidelines:
  - "Adapts guidance to the user\u2019s stated environment, constraints, and prior\
    \ context"
  - "States assumptions and limitations; asks at most 1\u20132 targeted clarifying\
    \ questions when needed"
  - Suggests sensible alternatives or next steps when information is insufficient
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-helpfulness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: helpfulness
- id: helpsteer2-correctness-judge-factual-claim-accuracy
  name: Factual Claim Accuracy
  version: '1.0'
  description: Evaluates whether declarative statements are factually correct and
    align with authoritative documentation and real-world behavior. Emphasis is on
    the truthfulness of claims about features, APIs, parameters, versions, limits,
    and platform capabilities, with severity weighted by impact on feasibility and
    outcomes.
  scoring_description: Score how well the response demonstrates factual claim accuracy
  definition: Evaluates whether declarative statements are factually correct and align
    with authoritative documentation and real-world behavior. Emphasis is on the truthfulness
    of claims about features, APIs, parameters, versions, limits, and platform capabilities,
    with severity weighted by impact on feasibility and outcomes.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Contains fabricated or impossible claims (e.g., non-existent features/APIs/cmdlets)
      or contradictions of well-established facts that would invalidate the solution.
    - Central statements directly conflict with authoritative sources or real-world
      behavior, making the guidance infeasible if followed.
    - Asserts definitive outcomes or capabilities without any basis, including time-
      or version-dependent claims that are plainly false.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Multiple major inaccuracies in key facts (features, defaults, parameters, version
      support) that materially mislead or break feasibility for common scenarios.
    - Conflates important technologies or versions (e.g., mixing platforms or API
      namespaces) in ways that contradict documentation.
    - Some correct elements exist, but false claims dominate the core guidance or
      prerequisites.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Overall plausible but includes notable inaccuracies or unverified assumptions
      (e.g., unsupported limits, misnamed parameters) that could cause partial failure
      or misconfiguration.
    - Mixes outdated or version-specific facts without qualification, leading to potential
      mismatch in common environments.
    - Claims lack clear caveats where needed (time-sensitive, edition/role constraints),
      reducing reliability though not wholly incorrect.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Claims are largely accurate and consistent with documentation; only minor imprecision
      or rounding that does not change feasibility or outcomes.
    - Version/platform distinctions are mostly correct with small omissions that do
      not affect typical setups.
    - Uncertain or time-sensitive facts are reasonably qualified; no material contradictions
      with authoritative sources.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - All factual statements precisely match authoritative documentation and observed
      real-world behavior, including correct features, parameters, defaults, and limits.
    - Accurate, explicit handling of version/edition/platform constraints and cross-environment
      distinctions; no conflation or outdated assertions.
    - Time-sensitive or uncertain facts are properly bounded (e.g., version noted,
      last-verified timing), with no unwarranted extrapolation or predictions.
  guidelines:
  - No fabricated features or capabilities are asserted
  - Claims align with vendor docs and well-established facts
  - Outcomes stated are realistically achievable as described
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-correctness-judge-tooling-api-validity
  name: Tooling and API Validity
  version: '1.0'
  description: Evaluates whether the referenced tools, SDKs, and APIs are real and
    correctly used, including syntax, parameters, and required modules or context.
    Assesses if code/commands would run under reasonable assumptions for the stated
    platform, version, and environment. Penalizes fabricated or mismatched tooling,
    invalid parameters, and missing essential setup that prevents execution.
  scoring_description: Score how well the response demonstrates tooling and api validity
  definition: Evaluates whether the referenced tools, SDKs, and APIs are real and
    correctly used, including syntax, parameters, and required modules or context.
    Assesses if code/commands would run under reasonable assumptions for the stated
    platform, version, and environment. Penalizes fabricated or mismatched tooling,
    invalid parameters, and missing essential setup that prevents execution.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Uses non-existent tools/cmdlets/APIs or mixes incompatible ecosystems (e.g.,
      Azure CLI flags on kubectl), making execution impossible.
    - Calls functions/endpoints or parameters that do not exist in the referenced
      SDK/CLI (fabricated names or impossible combinations).
    - Presents fictional or impossible capabilities as runnable code, or unlabeled
      pseudocode as if executable.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Multiple major tool/API mismatches (wrong cmdlet for platform, incompatible
      parameters/flags) that will fail at runtime.
    - Missing critical module/SDK imports or authentication/initialization required
      for any call to succeed.
    - Conflates resource types or API versions (e.g., deprecated/removed versions)
      without qualification, leading to failures.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - APIs and tools are plausible but include incorrect flags/resource or parameter
      names/types that need correction.
    - Context requirements are incomplete (e.g., missing a required import, endpoint/namespace/region
      selection, or version constraints).
    - Illustrative snippets are not clearly marked as pseudocode, or runnable code
      omits necessary request shapes/defaults.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Selects the correct tools/APIs for the platform; commands generally runnable
      with minor tweaks (naming, quoting, locale/region).
    - Parameter names and method signatures mostly match documentation; only minor
      formatting/optional flag issues remain.
    - Includes key module/package imports and basic context/auth setup; minor environment
      specifics may be implicit.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - All referenced tools/APIs exist and are used with correct syntax, parameter
      names/types, and valid option combinations for the platform.
    - All required modules/SDKs and context/auth steps are explicitly provided so
      code runs as-is under stated assumptions.
    - Clearly distinguishes runnable code from pseudocode and notes relevant version/endpoint
      constraints or feature availability.
  guidelines:
  - Cmdlets/functions and parameters exist for the stated platform
  - Code is syntactically valid and targets the correct SDK/module
  - API endpoints, methods, and payloads match official specs
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-correctness-judge-procedural-executability
  name: Procedural Executability
  version: '1.0'
  description: Measures whether a reader can follow the provided steps and code end-to-end,
    under reasonable assumptions, to achieve the stated goal. Emphasizes concrete,
    runnable commands, correct sequencing, and inclusion of necessary preconditions.
    Minor, easy substitutions are acceptable; missing critical steps or blockers reduce
    the score.
  scoring_description: Score how well the response demonstrates procedural executability
  definition: Measures whether a reader can follow the provided steps and code end-to-end,
    under reasonable assumptions, to achieve the stated goal. Emphasizes concrete,
    runnable commands, correct sequencing, and inclusion of necessary preconditions.
    Minor, easy substitutions are acceptable; missing critical steps or blockers reduce
    the score.
  criteria:
  - range: [0.0, 0.9]
    label: Non-Executable
    indicators:
    - Critical preconditions are absent (e.g., no required setup/authentication/connection),
      making completion impossible.
    - Steps contain contradictions or infeasible actions; sequence would fail regardless
      of user effort.
    - Commands/code rely on non-existent tools/functions or are not runnable as written.
  - range: [1.0, 1.9]
    label: Low Executability
    indicators:
    - Major gaps or ambiguities require substantial inference (e.g., provisioning/config
      steps omitted) and likely lead to failure.
    - Commands are largely generic or pseudocode without concrete parameters/tooling
      needed to run.
    - Ordering is unclear or incorrect in ways that commonly break the procedure.
  - range: [2.0, 2.9]
    label: Partial Executability
    indicators:
    - Core path is plausible but at least one blocking prerequisite or step is missing
      or under-specified.
    - Most commands are relevant but require non-trivial fixes (e.g., missing required
      flags, incomplete resource references).
    - Relies on significant unstated context/permissions or environment assumptions
      that many users will not meet.
  - range: [3.0, 3.9]
    label: High Executability
    indicators:
    - Prerequisites are identified and step order is sound; only minor edits (e.g.,
      filling in IDs, names, paths) are needed.
    - Commands/steps are concrete and runnable for a typical setup; small environment-specific
      tweaks suffice.
    - Edge cases or optional validations may be omitted but do not block completion
      for common scenarios.
  - range: [4.0, 4.0]
    label: Fully Executable
    indicators:
    - All necessary preconditions are stated and satisfied within the procedure (setup,
      authentication, permissions, environment).
    - Commands and parameters are valid and correctly sequenced to complete the task
      end-to-end without modification.
    - Includes verification steps or clear success criteria; no blockers or hidden
      assumptions.
  guidelines:
  - Includes necessary prerequisites and environment conditions
  - Step order and logic would produce the intended result
  - No missing dependencies or critical omissions that block execution
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-correctness-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: correctness
- id: helpsteer2-correctness-judge-assumptions-and-uncertainty-handling
  name: Assumptions and Uncertainty Handling
  version: '1.0'
  description: Measures how well the response identifies and qualifies assumptions,
    version-specific or time-sensitive details, and clearly separates confirmed facts
    from speculation. High-scoring responses make uncertainties explicit, provide
    verification steps, and avoid invented specifics. The goal is to ensure feasibility
    across environments by stating scope and limits without overstating certainty.
  scoring_description: Score how well the response demonstrates assumptions and uncertainty
    handling
  definition: Measures how well the response identifies and qualifies assumptions,
    version-specific or time-sensitive details, and clearly separates confirmed facts
    from speculation. High-scoring responses make uncertainties explicit, provide
    verification steps, and avoid invented specifics. The goal is to ensure feasibility
    across environments by stating scope and limits without overstating certainty.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - States unknown or time-sensitive details as definite (e.g., specific version/feature
      availability) without any caveats; invents specifics to fill gaps.
    - "Uses absolute language for variant behavior (e.g., \u201Calways/never\u201D\
      ) and provides no way to verify claims."
    - Confidently mixes speculation with facts or introduces fabricated capabilities/timelines
      with no qualification.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Rarely states assumptions; presents conditional or environment-dependent steps
      as universally applicable.
    - Overstates confidence in areas with clear uncertainty (version, region, licensing,
      permissions) and lacks qualifiers.
    - Provides no concrete verification guidance (e.g., commands or doc references)
      for claims that may change across versions.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Acknowledges some uncertainty but is vague or incomplete; assumptions are implied
      rather than explicitly listed.
    - Overgeneralizes across platforms/versions or omits caveats for common variants/edge
      cases.
    - "Uses tentative language without actionable checks (e.g., says \u201Cmay\u201D\
      \ or \u201Ctypically\u201D but does not suggest how to confirm)."
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - States key assumptions (e.g., product/version, role/permissions, environment)
      and clarifies scope, though not exhaustively.
    - "Qualifies version- or time-dependent claims with general caveats (e.g., \u201C\
      in recent versions\u201D) and avoids unwarranted specifics."
    - Includes at least one verification step or pointer (e.g., a command, API call,
      or doc section) to confirm uncertain details.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Explicitly lists relevant assumptions and constraints (environment, product/version,
      role/permissions, region) up front.
    - Clearly marks uncertain or time-sensitive information with precise qualifiers
      (e.g., date/version) and avoids invented details.
