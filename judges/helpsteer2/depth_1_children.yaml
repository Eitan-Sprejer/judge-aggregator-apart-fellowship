- id: helpsteer2-complexity-judge-scope-relevance-control
  name: Relevance and Scope Control
  version: '1.0'
  description: "Measures how tightly the response stays aligned to the user\u2019\
    s stated goal, avoiding scope creep or irrelevant elaboration. Rewards focused\
    \ content that advances the outcome, with clear separation of essentials from\
    \ optional extras. Penalizes tangents, unnecessary background, and added requirements\
    \ the user did not ask for."
  scoring_description: Score how well the response demonstrates relevance and scope
    control
  definition: "Measures how tightly the response stays aligned to the user\u2019s\
    \ stated goal, avoiding scope creep or irrelevant elaboration. Rewards focused\
    \ content that advances the outcome, with clear separation of essentials from\
    \ optional extras. Penalizes tangents, unnecessary background, and added requirements\
    \ the user did not ask for."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Does not address the core ask; most content is off-topic or generic filler.
    - Introduces unrelated subtopics/tools or new deliverables without any link to
      the request.
    - Expands scope substantially (e.g., new goals, workflows, or environments) without
      justification.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Partially addresses the ask but includes significant tangents or lengthy background
      not needed for the outcome.
    - Adds extra components or edge cases the user did not request and does not mark
      them as optional.
    - "Suggests alternatives or technologies that change the task\u2019s scope without\
      \ explaining relevance."
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Answers the core question but includes minor scope creep (e.g., extra options
      or digressions) that do not materially help.
    - Mixes essentials with optional details without clear separation, requiring the
      user to sift.
    - Lists multiple alternatives or repeats information where one concise, relevant
      path would suffice.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - "Stays mostly on-topic; content directly advances the user\u2019s stated outcome\
      \ with minimal distraction."
    - Includes only limited extras, clearly labeled as optional or next steps, with
      brief rationale.
    - If scope is ambiguous, states a concise assumption or asks one targeted clarifying
      question to maintain focus.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Tightly aligned to the exact ask; every element contributes to the outcome with
      no filler or tangents.
    - Proactively prunes irrelevant detail and limits alternatives to the best-fit
      path, with succinct justification; optional items are explicitly segregated.
    - Surfaces only necessary assumptions and constraints to bound the solution and
      prevent scope expansion.
  guidelines:
  - Excludes tangential tools, technologies, or theory that do not advance the task
  - Each detail serves a clear purpose toward the stated goal; minimal fluff
  - Explicitly flags optional or out-of-scope topics without letting them dominate
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-complexity-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: complexity
- id: helpsteer2-complexity-judge-calibration-and-assumptions
  name: Calibration via Assumptions and Clarifications
  version: '1.0'
  description: Measures how well the assistant surfaces prerequisites and environment
    assumptions, and asks focused clarifying questions to set the right level of complexity.
    Rewards concise, high-impact assumptions and minimal, targeted questions that
    unblock progress; penalizes ignoring constraints or asking broad, numerous, or
    irrelevant questions. Emphasizes conditional guidance that works under stated
    assumptions while awaiting user input.
  scoring_description: Score how well the response demonstrates calibration via assumptions
    and clarifications
  definition: Measures how well the assistant surfaces prerequisites and environment
    assumptions, and asks focused clarifying questions to set the right level of complexity.
    Rewards concise, high-impact assumptions and minimal, targeted questions that
    unblock progress; penalizes ignoring constraints or asking broad, numerous, or
    irrelevant questions. Emphasizes conditional guidance that works under stated
    assumptions while awaiting user input.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Ignores obvious prerequisites/constraints and proceeds with a generic or mismatched
      solution.
    - States no assumptions and asks no clarifying questions despite clear ambiguity.
    - Introduces steps or requirements that likely violate common constraints (e.g.,
      permissions, platform) without checking.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Makes vague or incorrect assumptions, or asks broad, unfocused questions that
      shift the burden to the user.
    - Misses at least one critical constraint or prerequisite that determines feasibility
      or approach.
    - Requests multiple pieces of low-impact information before giving any actionable
      next step.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - States at least one relevant assumption or asks one relevant question, but overlooks
      other key constraints or decision points.
    - Assumptions or questions are verbose or multi-part, only loosely scoped to the
      task.
    - Offers a tentative path without clearly marking it as conditional on the stated
      assumptions.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Briefly surfaces key assumptions and constraints that shape the approach, marking
      them as adjustable.
    - "Asks 1\u20132 targeted, high-impact questions only when necessary to select\
      \ between concrete paths."
    - Proposes a conditional plan that works under current assumptions and notes how
      it would change with different answers.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Concisely identifies the few prerequisites, environment details, and decision
      points that most affect complexity and feasibility.
    - 'Uses progressive disclosure: offers safe default assumptions with rationale,
      asks minimal high-priority questions first, and provides fallbacks.'
    - Delivers tailored next steps for likely scenarios so the user can make immediate
      progress while awaiting clarifications, without scope creep.
  guidelines:
  - States key prerequisites and assumptions (APIs, permissions, environment) that
    affect complexity
  - Asks only essential clarifying questions when ambiguity would change depth or
    approach
  - Tailors depth and artifacts after assumptions are set or clarified
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-complexity-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: complexity
- id: helpsteer2-verbosity-judge-proportionality
  name: Proportionality to Task Complexity
  version: '1.0'
  description: "Measures whether the response\u2019s length, depth, and format scale\
    \ with the task\u2019s complexity and the prompt\u2019s specificity. Rewards tight,\
    \ actionable content in the expected format (code/steps for procedural asks; brief\
    \ explanations for conceptual asks) and penalizes clear mismatches in length or\
    \ depth."
  scoring_description: Score how well the response demonstrates proportionality to
    task complexity
  definition: "Measures whether the response\u2019s length, depth, and format scale\
    \ with the task\u2019s complexity and the prompt\u2019s specificity. Rewards tight,\
    \ actionable content in the expected format (code/steps for procedural asks; brief\
    \ explanations for conceptual asks) and penalizes clear mismatches in length or\
    \ depth."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - 'Gross mismatch: e.g., a long tutorial for a simple ask or a one-liner for a
      complex multi-step/code task.'
    - Ignores expected format (no code/steps when explicitly requested) and/or buries
      or omits actionable content.
    - Majority irrelevant or repetitive (>50%), preventing immediate use.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - 'Noticeable mismatch of length or depth: substantial fluff or background (>25%)
      or too terse to execute without guessing.'
    - Format does not align with task type (e.g., conceptual prose where a script/steps
      was requested).
    - Actionable elements are padded or incomplete, likely requiring significant follow-up.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - 'Some imbalance: slightly verbose or somewhat under-detailed; minor follow-up
      needed or minor redundancy present.'
    - Includes most necessary elements but omits a few specifics or adds tangential
      context.
    - Format partially appropriate (e.g., code present but interleaved with unnecessary
      narrative).
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Length and depth mostly match task complexity and prompt specificity; fully
      usable with minimal extra text.
    - Uses an appropriate format (code/ordered steps for procedural; concise explanation
      for conceptual) with no significant omissions.
    - Only essential qualifiers included; avoids repetition and broad overviews.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - "Optimally scaled: precise amount of detail for the task\u2019s complexity (e.g.,\
      \ tight code/steps for procedures; 1\u20133 focused sentences for concepts)."
    - Uses the expected format immediately (actionable content first) with no fluff
      or tangents.
    - Contains only essential parameters/notes; nothing extraneous, no follow-up needed.
  guidelines:
  - "Simple asks get 1\u20133 focused sentences; complex tasks get succinct steps\
    \ or a tight code block."
  - No obvious over-expansion for simple requests or under-detail for complex ones.
  - "Length stays within a reasonable band (e.g., \xB125%) of what is needed to act."
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-verbosity-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: verbosity
- id: helpsteer2-verbosity-judge-actionable-sufficiency
  name: Actionable Sufficiency
  version: '1.0'
  description: Measures whether the response provides just enough concrete steps or
    runnable code for a competent user to execute the task without follow-up. Rewards
    precise, complete instructions that include only essential prerequisites and parameters;
    penalizes both missing essentials and unnecessary elaboration that hinders execution.
  scoring_description: Score how well the response demonstrates actionable sufficiency
  definition: Measures whether the response provides just enough concrete steps or
    runnable code for a competent user to execute the task without follow-up. Rewards
    precise, complete instructions that include only essential prerequisites and parameters;
    penalizes both missing essentials and unnecessary elaboration that hinders execution.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - No executable steps or code, or critical steps/parameters are absent or incorrect.
    - Content is conceptual, generic, or contradictory; cannot be used to perform
      the task.
    - Requires major assumptions or external research before any action is possible.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Contains some actionable elements, but major gaps remain (e.g., missing auth,
      prerequisites, or file/resource identifiers).
    - Instructions are vague or ambiguous (undefined placeholders, unspecified versions/targets),
      making failure likely.
    - Substantial irrelevant options/discussion obscures the execution path.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Mostly actionable but requires minor inference or trial-and-error (e.g., missing
      one or two flags, filenames, or ordering details).
    - Steps/code exist but are not fully ready to run (uninitialized variables, unclear
      environment assumptions) or present multiple alternatives creating choice paralysis.
    - Some redundancy or over-detail slows execution but does not block it.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Provides a complete, logically ordered step list or runnable code with clearly
      marked minimal placeholders.
    - States essential prerequisites/configuration values and avoids extraneous alternatives;
      uses a single coherent approach.
    - A competent user can proceed immediately with only trivial substitutions (e.g.,
      path/API key) and no follow-up questions.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - 'Immediately executable path: concise, correct commands/code or steps that work
      as-is with at most obvious placeholder substitution.'
    - Includes just-in-time essentials (prerequisites, auth, inputs, and a quick verification)
      and nothing superfluous.
    - Eliminates ambiguity and branching; consistent parameters and a brief note for
      the most common blocker, if any.
  guidelines:
  - Provides runnable code or ordered steps when the prompt implies action.
  - Includes only minimal, targeted annotations for key params/prereqs.
  - "Avoids micro-detail or narration that doesn\u2019t change execution."
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-verbosity-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: verbosity
- id: helpsteer2-verbosity-judge-topical-relevance
  name: Topical Relevance and Boilerplate Avoidance
  version: '1.0'
  description: "Measures how tightly the response stays on the user\u2019s specific\
    \ request and avoids generic boilerplate, product overviews, and tangents. High-scoring\
    \ responses contain only task-relevant content and just-in-time context; low-scoring\
    \ responses include filler, repeated caveats, and unrelated explanations that\
    \ do not advance the requested outcome."
  scoring_description: Score how well the response demonstrates topical relevance
    and boilerplate avoidance
  definition: "Measures how tightly the response stays on the user\u2019s specific\
    \ request and avoids generic boilerplate, product overviews, and tangents. High-scoring\
    \ responses contain only task-relevant content and just-in-time context; low-scoring\
    \ responses include filler, repeated caveats, and unrelated explanations that\
    \ do not advance the requested outcome."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - "Majority of content (>50%) is generic boilerplate, product overviews, or tangents\
      \ unrelated to completing the user\u2019s task."
    - Actionable or answer-specific content is missing or buried within long irrelevant
      narrative.
    - Includes repeated disclaimers/definitions or marketing language not tied to
      the ask.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - "Substantial irrelevant content (~25\u201350%): generic caveats, background,\
      \ or comparisons not requested."
    - Multiple boilerplate notes or environment disclaimers that do not directly enable
      the task.
    - Actionable content exists but is diluted by off-topic explanation or repeated
      reminders.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - "Some tangential or generic material (~10\u201325%) that could be removed without\
      \ loss of meaning."
    - Includes at least one boilerplate caveat or definition not clearly necessary
      for the task.
    - Minor repetition or context that only loosely supports the requested outcome.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - "Mostly on-topic with minimal nonessential content (\u22645%); no product overviews\
      \ or marketing language."
    - Only brief, necessary qualifiers that directly support execution of the task.
    - "No redundant points; each section maps clearly to the user\u2019s specific\
      \ request."
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Every sentence directly advances the requested outcome (0% filler or tangents).
    - 'Zero generic boilerplate: no broad caveats, product overviews, or unrelated
      context; only task-specific, just-in-time notes.'
    - Actionable content is foregrounded and immediately usable, with any brief annotations
      strictly enabling the task.
  guidelines:
  - "Non-essential context is limited (e.g., under 10\u201320% of content)."
  - No broad definitions/comparisons unless the user asked for them.
  - Disclaimers appear only when they materially affect execution.
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-verbosity-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: verbosity
- id: helpsteer2-verbosity-judge-structural-density
  name: Structural Density and Accessibility
  version: '1.0'
  description: Measures how well the response is organized to maximize signal-to-noise
    and make actionable content easy to extract at a glance. Rewards code-first or
    steps-first structures with minimal preamble and compact formatting. Penalizes
    meandering narrative, buried instructions, and inconsistent structure that hinders
    scanning.
  scoring_description: Score how well the response demonstrates structural density
    and accessibility
  definition: Measures how well the response is organized to maximize signal-to-noise
    and make actionable content easy to extract at a glance. Rewards code-first or
    steps-first structures with minimal preamble and compact formatting. Penalizes
    meandering narrative, buried instructions, and inconsistent structure that hinders
    scanning.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Actionable content is buried in long narrative; code/steps are hard to locate
      or not separated.
    - Large unstructured paragraphs with no clear bullets, numbering, headings, or
      code blocks.
    - 'Disorganized flow: key steps scattered, duplicated, or interleaved with tangents.'
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Some structure exists, but actionable content appears after extended exposition
      or is interleaved with commentary.
    - Inconsistent or incorrect use of bullets/numbering; code fragments lack clear
      block formatting.
    - Extraneous side notes reduce scannability and obscure the main actions.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Includes steps or code blocks, but preamble/context dominates or precedes excessively;
      users must scan to find actions.
    - Partial grouping/headings with mixed narrative and instructions; some redundancy
      or digressions.
    - Key parameters or outputs are not aligned with steps/code, requiring cross-referencing.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - "Code-first or steps-first with only brief (one\u2013two sentences) context;\
      \ primary actions are immediately visible."
    - Consistent, clean formatting (numbered steps, bullets, or a compact code block)
      with minimal inline commentary.
    - Logical sequencing and grouping; little to no scrolling needed to act.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - 'Actionable content is front-loaded and unmistakable: compact code or ordered
      steps first, followed by minimal targeted notes.'
    - Highly scannable layout with clear headings/labels, whitespace, and separation
      of action from explanation.
    - No fluff; each block has a single purpose; critical parameters highlighted inline
      or succinctly annotated after.
  guidelines:
  - Bullets/numbered steps or compact code blocks replace long prose.
  - Actionable content appears first; brief notes follow.
  - No burying of code or steps within lengthy narrative.
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-verbosity-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: verbosity
- id: helpsteer2-verbosity-judge-redundancy-control
  name: Redundancy and Brevity Control
  version: '1.0'
  description: Measures how well a response avoids repetition and unnecessary wording
    so every sentence adds distinct, actionable value. Emphasizes short, direct phrasing
    and inclusion of only qualifiers that change user action or choices.
  scoring_description: Score how well the response demonstrates redundancy and brevity
    control
  definition: Measures how well a response avoids repetition and unnecessary wording
    so every sentence adds distinct, actionable value. Emphasizes short, direct phrasing
    and inclusion of only qualifiers that change user action or choices.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Repeats the same idea/instruction 3+ times or mirrors bullets with near-duplicate
      wording.
    - '>40% of text is removable without loss (filler, hedging, boilerplate, or restatements).'
    - Actionable content is buried under verbose openings/conclusions and redundant
      explanations.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Noticeable duplication (ideas or phrases repeated 2+ times) or summary that
      rehashes prior content.
    - Frequent wordiness (e.g., 'in order to', 'due to the fact that'); average sentence
      length >22 words.
    - "Includes qualifiers/disclaimers that do not change user action, contributing\
      \ roughly \u226525% fluff."
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - "Some repetition or verbose phrasing remains (1\u20132 duplicated points); could\
      \ trim ~10\u201320% without loss."
    - Occasional unnecessary setup/transition sentences or redundant summaries.
    - Mix of concise and long sentences; includes some qualifiers that do not affect
      steps or choices.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - No significant repeats; trimming would remove <10% with minimal impact.
    - "Direct, active phrasing; most sentences 10\u201320 words; few non-essential\
      \ qualifiers."
    - Each bullet/sentence adds new information; avoids redundant transitions and
      restatements.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Zero repeated ideas or phrasings; every sentence is uniquely task-relevant.
    - "Tight, direct wording (e.g., 'to' instead of 'in order to'); average sentence\
      \ length 8\u201316 words."
    - Only just-in-time qualifiers that alter user action or choice; no throat-clearing
      or boilerplate.
  guidelines:
  - No repeated instructions in different wording.
  - Concise sentences with minimal hedging and qualifiers.
  - Similar points consolidated into a single concise note.
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-verbosity-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: verbosity
