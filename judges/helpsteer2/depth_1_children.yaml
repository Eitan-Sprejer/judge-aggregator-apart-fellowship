- id: helpsteer2-coherence-judge-internal-consistency
  name: Internal Consistency
  version: '1.0'
  description: Assesses whether a response maintains consistent claims, assumptions,
    and instructions throughout. It flags contradictions, unexplained reversals, and
    mismatches between prose and artifacts (code, parameters, variable names, outputs).
    Minor factual errors are only penalized if they create internal inconsistency
    or conflict.
  scoring_description: Score how well the response demonstrates internal consistency
  definition: Assesses whether a response maintains consistent claims, assumptions,
    and instructions throughout. It flags contradictions, unexplained reversals, and
    mismatches between prose and artifacts (code, parameters, variable names, outputs).
    Minor factual errors are only penalized if they create internal inconsistency
    or conflict.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Fundamental, irreconcilable contradictions that invalidate the response (e.g.,
      mutually exclusive commands required simultaneously).
    - Assumptions and artifacts conflict throughout (e.g., claims offline execution
      but includes steps to download dependencies), making the response unusable.
    - Contradictory goals or outputs that cannot both be true (e.g., guarantees both
      full anonymity and full traceability).
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Multiple conflicts or reversals without explanation (e.g., states a feature
      is unsupported, then requires it).
    - Inconsistent tool/entity/variable names or parameters across sections causing
      uncertainty about what to execute.
    - Steps or flags contradict earlier constraints or each other (e.g., instructs
      to enable and disable the same setting).
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - One or two localized inconsistencies that require reader inference to reconcile
      (e.g., variable A in text but B in code).
    - Mixed signals about conditions, assumptions, or risk levels without a clear
      resolution, yet a plausible path remains.
    - Partial mismatch between described outcomes and artifacts (e.g., states JSON
      output while example shows YAML).
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Overall consistent with only minor wording or emphasis shifts that do not change
      meaning.
    - Rare, small mismatches (e.g., singular vs. plural, minor renaming) that are
      easy to reconcile and do not affect execution.
    - Reasoning and steps introduce no conflicting requirements; expected outcomes
      align broadly with commands/config.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - No contradictions between statements, steps, and code; names, parameters, and
      versions are used consistently.
    - Stated conditions and constraints are honored throughout; later steps do not
      violate prerequisites or earlier assertions.
    - Explanations and expected outcomes precisely match artifacts (commands/config/outputs),
      including flags and variable values.
  guidelines:
  - No conflicting claims or instructions across sections
  - No unexplained reversals (e.g., recommending and then rejecting an approach)
  - Parameters, constraints, and stated assumptions remain consistent
  score_range: [0.0, 4.0]
  parent_id: helpsteer2-coherence-judge
  dataset: helpsteer2
  auto_generated: true
  dimension: coherence
- id: helpsteer2-coherence-judge-terminology-and-reference-consistency
