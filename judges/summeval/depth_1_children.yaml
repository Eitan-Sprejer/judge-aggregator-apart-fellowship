judges:
- id: summeval-coherence-judge-narrative-structure-and-ordering
  name: Narrative Structure and Ordering
  version: '1.0'
  description: Assesses whether the summary opens with a clear lead, presents supporting
    details in a logical sequence, and optionally provides a wrap or takeaway. Focuses
    on macro-level organization and flow that make the piece read as a unified whole,
    not on factual accuracy or coverage.
  scoring_description: Score how well the response demonstrates narrative structure
    and ordering
  definition: Assesses whether the summary opens with a clear lead, presents supporting
    details in a logical sequence, and optionally provides a wrap or takeaway. Focuses
    on macro-level organization and flow that make the piece read as a unified whole,
    not on factual accuracy or coverage.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - No discernible lead or progression; sentences read as disconnected fragments.
    - Severe, unexplained jumps in time/topic or circular back-and-forth that prevent
      a unified whole.
    - Ordering actively obscures meaning (e.g., outcomes before events with no cues,
      context scattered unpredictably).
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - No clear lead; opening fails to frame the main point.
    - Facts appear in list-like or arbitrary order with weak or missing sequencing
      cues.
    - Frequent disruptive shifts in time/topic or repeated backtracking between points.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - A lead exists but is vague, delayed, or only partially frames the main point.
    - Support is unevenly ordered with noticeable choppiness or context arriving after
      specifics.
    - One or two disruptive jumps in time/topic that momentarily interrupt the overall
      flow.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Clear lead followed by generally logical sequencing of supporting details.
    - Minor reordering quirks or light backtracking that do not impede understanding.
    - Closing idea may be implicit or brief, but the piece reads as a coherent whole.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - "Strong, concise lead that frames the main point, followed by purposefully ordered\
      \ support (e.g., event \u2192 context \u2192 implication)."
    - Consistent forward progression with no disruptive jumps or backtracking; timeline
      and focus are maintained.
    - Optional wrap reinforces the takeaway or closes the thread cleanly without redundancy.
  guidelines:
  - Begins with a concise lead that frames the main point
  - Supporting sentences follow in a logically organized sequence
  - No jarring backtracking or reordering that disrupts the storyline
  score_range: [0.0, 4.0]
  parent_id: summeval-coherence-judge
  dataset: summeval
  auto_generated: true
  dimension: coherence
- id: summeval-coherence-judge-referential-coherence
  name: Referential Coherence
  version: '1.0'
  description: Assesses how clearly pronouns, definite noun phrases, and entity labels
    point to identifiable antecedents across sentences and remain consistent. It focuses
    solely on reference tracking (who/what is being talked about), not on topical
    transitions or logical ordering.
  scoring_description: Score how well the response demonstrates referential coherence
  definition: Assesses how clearly pronouns, definite noun phrases, and entity labels
    point to identifiable antecedents across sentences and remain consistent. It focuses
    solely on reference tracking (who/what is being talked about), not on topical
    transitions or logical ordering.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Pervasive unresolved or contradictory references; readers cannot determine who/what
      is being discussed across sentences
    - Multiple cross-sentence swaps or misattributions (actions/quotes assigned to
      the wrong entity)
    - References routinely lack antecedents or change referents mid-discussion, collapsing
      entity tracking
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Frequent pronouns or definite NPs have no unique antecedent or could refer to
      multiple entities
    - Inconsistent naming or role labels (e.g., switching among similar titles/names)
      causes ongoing confusion
    - Misaligned references lead to repeated uncertainty about which entity performed
      actions or statements
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Several unclear or weakly anchored references that require rereading to infer
      antecedents
    - At least one instance of label drift or role/name switching that momentarily
      confuses entity identity
    - "Ambiguous deictics or plurals (e.g., \u201Cthis,\u201D \u201Cthey\u201D) when\
      \ multiple candidates are present"
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - References are clear in nearly all cases; rare minor ambiguities do not impede
      entity tracking
    - Occasional distant or implicit antecedent, but resolvable from context
    - Entity labels remain consistent with at most one harmless variation (e.g., surname
      vs. title) used unambiguously
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Every pronoun and definite NP has a single, unmistakable antecedent in context
    - Entity names/titles are stable across sentences with no label drift or swaps
    - Deictics (this/that/these) are explicitly anchored, requiring no rereading to
      resolve
  guidelines:
  - Pronouns (he/she/they/it/this) resolve unambiguously to a specific prior mention
  - Entity names, titles, and acronyms are used consistently without mix-ups
  - Avoids introducing new referents without proper identification
  score_range: [0.0, 4.0]
  parent_id: summeval-coherence-judge
  dataset: summeval
  auto_generated: true
  dimension: coherence
- id: summeval-coherence-judge-temporal-and-causal-continuity
  name: Temporal and Causal Continuity
  version: '1.0'
  description: "Assesses how clearly and consistently the summary presents the sequence\
    \ of events and the cause\u2013effect relationships connecting them. Emphasizes\
    \ consistent tense, accurate use of temporal/causal connectives, and internally\
    \ consistent ordering so readers can reconstruct when things happened and why;\
    \ ignores external factual accuracy unless it creates internal contradictions."
  scoring_description: Score how well the response demonstrates temporal and causal
    continuity
  definition: "Assesses how clearly and consistently the summary presents the sequence\
    \ of events and the cause\u2013effect relationships connecting them. Emphasizes\
    \ consistent tense, accurate use of temporal/causal connectives, and internally\
    \ consistent ordering so readers can reconstruct when things happened and why;\
    \ ignores external factual accuracy unless it creates internal contradictions."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Timeline is unintelligible with contradictory ordering or dates and frequent
      tense shifts that obscure sequence.
    - Causal links are confused or self-contradictory (e.g., effects precede their
      stated causes or incompatible causes are given).
    - Temporal/causal connectives are misused or absent, making reconstruction of
      when and why events occurred impossible.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Ordering is often ambiguous with abrupt time jumps and inconsistent tense requiring
      heavy reader inference.
    - Effects or causes are presented without the other, or causal claims are weak/implicit,
      leading to confusion.
    - Temporal or causal connectives are used inconsistently or incorrectly, creating
      frequent uncertainty about sequence or rationale.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - A basic timeline is discernible but includes occasional ambiguity, minor tense
      drift, or muddled relative timing.
    - "Some cause\u2013effect links are clear while others are implied or unsupported,\
      \ with occasional leaps in logic."
    - Temporal/causal markers appear sporadically, leaving gaps that require moderate
      inference to connect events.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Chronology is clear and mostly consistent, aided by appropriate temporal cues
      and stable tense.
    - Causal relationships are largely explicit and logical with no reversals or incompatible
      explanations.
    - Temporal and causal connectives are correct and sufficient, with only minor
      gaps that do not impede understanding.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Unambiguous, well-signposted chronology with consistent tense and precise temporal
      markers enabling effortless reconstruction.
    - Complete and coherent causal chain where causes, mediating events, and outcomes
      are explicitly linked without gaps.
    - No internal conflicts in timing or causality; connectives are precise and purposeful,
      yielding a smooth, natural flow.
  guidelines:
  - Tense and temporal markers (e.g., earlier, after, meanwhile) align to a coherent
    timeline
  - Sequence of events is easy to follow without unexplained jumps
  - Cause-effect relationships are signaled and not contradicted by later sentences
  score_range: [0.0, 4.0]
  parent_id: summeval-coherence-judge
  dataset: summeval
  auto_generated: true
  dimension: coherence
- id: summeval-coherence-judge-transitions-and-cohesive-devices
  name: Transitions and Cohesive Devices
  version: '1.0'
  description: 'Assesses micro-level cohesion between sentences: how well transitions,
    referential ties, and lexical chaining connect adjacent sentences to avoid a choppy,
    list-like feel. Judges presence, variety, and appropriateness of cohesive devices
    (e.g., connectives, anaphora, synonymy) without penalizing minor grammar unless
    it breaks cohesion.'
  scoring_description: Score how well the response demonstrates transitions and cohesive
    devices
  definition: 'Assesses micro-level cohesion between sentences: how well transitions,
    referential ties, and lexical chaining connect adjacent sentences to avoid a choppy,
    list-like feel. Judges presence, variety, and appropriateness of cohesive devices
    (e.g., connectives, anaphora, synonymy) without penalizing minor grammar unless
    it breaks cohesion.'
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Sentences read as isolated items with no connective cues; relations (time/cause/contrast)
      are absent or contradictory.
    - Pronouns or definite noun phrases lack clear antecedents, causing breakdowns
      in linkage.
    - Connectives, when present, are misused (e.g., 'however' for addition), creating
      confusion.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Sparse or mechanical linking; mostly list-like with punctuation-only joins or
      repeated 'and' without signaling relations.
    - Inconsistent lexical chains (names/titles alternate without bridging), producing
      choppiness.
    - Key relations are left implicit across adjacent sentences, forcing readers to
      infer through gaps.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Mix of linked and unlinked sentence pairs; several adjacency gaps yield intermittent
      choppiness.
    - Limited variety or occasional misuse of cohesive devices (e.g., overreliance
      on 'also' or 'meanwhile').
    - Lexical chaining and pronoun use are present but uneven, with occasional ambiguity.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Most adjacent sentences signal their relation with accurate transitions or structural
      cues (contrast, elaboration, chronology).
    - Clear referential ties via pronouns, repetition, and synonymy maintain topic
      continuity without awkward redundancy.
    - Only minor lapses or brief gaps; overall flow avoids a list-like feel.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Every adjacency is supported by precise, varied cohesive cues (connectives,
      anaphora, lexical chains, parallelism) matching intended relations.
    - Transitions are unobtrusive yet clarifying (e.g., 'however,' 'as a result,'
      'earlier,' 'in contrast'), with no overuse.
    - Referents are consistently resolved with zero ambiguity; the passage reads seamlessly
      with no choppiness.
  guidelines:
  - Uses linking words or lexical ties to show addition, contrast, or elaboration
  - Sentences build on prior ones rather than read as isolated bullet points
  - Smooth shifts between related points without abrupt topic jumps
  score_range: [0.0, 4.0]
  parent_id: summeval-coherence-judge
  dataset: summeval
  auto_generated: true
  dimension: coherence
- id: summeval-coherence-judge-topic-and-pov-consistency
  name: Topic and Point-of-View Consistency
  version: '1.0'
  description: Assesses whether the summary maintains a single, unified topic and
    a consistent narrative point of view (person, tense, stance, and attribution)
    across sentences. Penalizes digressions, unjustified shifts in perspective, or
    internal contradictions that break unity. Factual accuracy is ignored unless it
    creates internal conflict or viewpoint inconsistency.
  scoring_description: Score how well the response demonstrates topic and point-of-view
    consistency
  definition: Assesses whether the summary maintains a single, unified topic and a
    consistent narrative point of view (person, tense, stance, and attribution) across
    sentences. Penalizes digressions, unjustified shifts in perspective, or internal
    contradictions that break unity. Factual accuracy is ignored unless it creates
    internal conflict or viewpoint inconsistency.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - No clear central topic; sentences introduce unrelated or conflicting storylines
    - Perspective changes repeatedly (person/tense/stance) with no rationale, making
      the narrator viewpoint unclear
    - "Direct internal contradictions about who did what or when that undermine the\
      \ paragraph\u2019s unity"
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Main topic appears but is frequently disrupted by digressions or side threads
    - One or more unjustified shifts in person, tense, or stance; attributions are
      inconsistent across sentences
    - Internal inconsistencies (e.g., incompatible claims about roles or timing) that
      impede smooth reading
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Central topic is discernible but includes tangential details or a minor off-topic
      sentence
    - Perspective is mostly stable with occasional brief shifts in person/tense/stance
      that momentarily distract
    - Minor internal tension (e.g., soft or implied contradictions) without derailing
      the overall viewpoint
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Clear central topic maintained; supporting details remain relevant and aligned
    - Consistent narrative perspective (person, tense, stance, attribution) with no
      meaningful slips
    - No substantive internal contradictions; reads as a unified account
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Unwavering focus on a single storyline; every sentence directly supports the
      same topic
    - Seamlessly consistent point of view and tense; attributions and stance remain
      uniform throughout
    - Zero internal contradictions or perspective shifts; unity is tight and effortless
  guidelines:
  - Maintains the same central topic/event without drift to unrelated points
  - Point of view, voice, and framing remain consistent across sentences
  - No internal contradictions that undermine the unified narrative
  score_range: [0.0, 4.0]
  parent_id: summeval-coherence-judge
  dataset: summeval
  auto_generated: true
  dimension: coherence
- id: summeval-consistency-judge-entity-and-event-accuracy
  name: Entity and Event Accuracy
  version: '1.0'
  description: "Assesses whether the summary correctly identifies the core entities\
    \ and the central event\u2014who did what, where (and when, if stated)\u2014as\
    \ presented in the source article. Emphasizes accurate roles, actions, and locations\
    \ without introducing unsupported entities or events. Faithful paraphrasing that\
    \ preserves identities and roles is acceptable; omissions are not penalized unless\
    \ they alter who did what or where."
  scoring_description: Score how well the response demonstrates entity and event accuracy
  definition: "Assesses whether the summary correctly identifies the core entities\
    \ and the central event\u2014who did what, where (and when, if stated)\u2014as\
    \ presented in the source article. Emphasizes accurate roles, actions, and locations\
    \ without introducing unsupported entities or events. Faithful paraphrasing that\
    \ preserves identities and roles is acceptable; omissions are not penalized unless\
    \ they alter who did what or where."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - 'Multiple core elements contradict the article: wrong main actor and/or wrong
      event and/or wrong primary location, or a fabricated central event.'
    - Systematic role swaps or conflation of key entities that invert who did what;
      major location/date errors.
    - Introduces invented central entities or events not present in the article.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - 'At least one major misidentification of a core element: wrong main actor, wrong
      event type, or wrong primary location.'
    - Misattributes the central action to the wrong entity (role reversal) or asserts
      an unsupported linkage between entities/events.
    - Two or more specific entities or event details that cannot be verified from
      the article.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Main actor and central event are correct, but there is one clear error in a
      secondary role/detail (e.g., wrong title/affiliation) or an incorrect sub-location/date
      that does not change the primary location.
    - Two minor inaccuracies in peripheral entities or event descriptors (e.g., committee/department
      name, venue section) that introduce some ambiguity without changing who did
      what or where.
    - No fabricated central event, but includes one unverifiable peripheral entity
      or place detail.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Core who-what-where are correct; at most one minor, non-salient discrepancy
      (e.g., secondary affiliation or sub-location nuance) that does not alter the
      central event or roles.
    - No invented entities or events; any added context is generic and does not change
      actors, event type, or location.
    - Roles and attributions are preserved; any ambiguity does not shift responsibility
      or the identity of the event.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - All core entities, roles, and the central event match the article exactly or
      with faithful paraphrase; primary location (and date/time, if given) aligns
      precisely.
    - No unsupported or invented entities, events, or role details; no role swaps,
      conflations, or causal reversals.
    - Attributions and identities are faithfully preserved, maintaining who did what
      and where without extrapolation.
  guidelines:
  - Main actors, organizations, and locations match the article with correct roles
    (no role swaps).
  - Event identity and outcome align with the article (no wrong event or result).
  - No substitution of similarly named entities or places.
  score_range: [0.0, 4.0]
  parent_id: summeval-consistency-judge
  dataset: summeval
  auto_generated: true
  dimension: consistency
- id: summeval-consistency-judge-quantitative-detail-accuracy
  name: Quantitative and Temporal Detail Accuracy
  version: '1.0'
  description: Evaluates how faithfully a summary reproduces numbers, counts, magnitudes,
    dates, and timeframes from the source article. Checks each quantitative and temporal
    claim for exact or equivalent meaning, including acceptable rounding bounds and
    proper hedging. Key figures (e.g., official totals, event dates, central monetary
    amounts) must be preserved precisely; small peripheral drifts may be tolerated
    only within clearly defined limits.
  scoring_description: Score how well the response demonstrates quantitative and temporal
    detail accuracy
  definition: Evaluates how faithfully a summary reproduces numbers, counts, magnitudes,
    dates, and timeframes from the source article. Checks each quantitative and temporal
    claim for exact or equivalent meaning, including acceptable rounding bounds and
    proper hedging. Key figures (e.g., official totals, event dates, central monetary
    amounts) must be preserved precisely; small peripheral drifts may be tolerated
    only within clearly defined limits.
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Multiple key numeric/temporal facts are wrong or fabricated (e.g., order-of-magnitude
      errors, wrong month/year, reversed chronology).
    - Invents counts, dates, durations, or rates not in the article or directly contradicts
      reported figures.
    - Pervasive inconsistencies make quantitative/temporal claims untraceable to the
      source.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - "At least one key number or date/timeframe is misstated (e.g., deviation >\xB1\
      10%, wrong specific date/day, or duration category changed such as days to weeks)."
    - Two or more significant peripheral drifts or unhedged roundings that materially
      shift totals or timing, though not by an order of magnitude.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - "No errors in key numbers/dates, but includes one significant peripheral drift\
      \ (\xB15\u201310% or \xB12 days) or 2\u20133 smaller unhedged approximations."
    - Loss of specificity that does not change month/year, magnitude class, or event
      sequence (e.g., '50' for '47' without 'about'; 'May' for 'May 3').
    - Ambiguous temporal phrasing could suggest a slightly broader/narrower window
      than stated in the source.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - "All key numbers and dates/timeframes are exact; at most one minor peripheral\
      \ drift within \xB15% or \xB11 unit (whichever larger) for counts, or \xB11\
      \ day for multi-day periods."
    - Approximations, if used, are clearly hedged (e.g., 'about', 'approximately')
      and do not change scale (hundreds vs. thousands) or named periods (week/month).
    - Numeric and temporal order is preserved with no change to event sequence.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - All numeric and temporal details are exact or strictly equivalent in meaning;
      key figures and specific dates match precisely with no date/day shift or sequence
      change.
    - "Any peripheral rounding is explicitly hedged and stays within \xB12% or \xB1\
      1 unit (whichever larger) for counts; durations/timeframes, if summarized, remain\
      \ category-equivalent (e.g., 'two weeks' for '14 days') without shifting the\
      \ calendar date."
    - No unsupported numeric/temporal additions or extrapolations.
  guidelines:
  - Counts, percentages, and amounts match or are safely summarized without changing
    magnitude or scope.
  - Dates, times, and durations are correct and do not shift the timeframe.
  - No invented or altered numeric specifics (e.g., fabricated tallies or misreported
    dates).
  score_range: [0.0, 4.0]
  parent_id: summeval-consistency-judge
  dataset: summeval
  auto_generated: true
  dimension: consistency
- id: summeval-consistency-judge-causal-and-relational-consistency
  name: Causal and Relational Consistency
  version: '1.0'
  description: "Evaluates whether the summary preserves the article\u2019s cause\u2013\
    effect links, actor\u2013action\u2013recipient roles, temporal order, and stated\
    \ outcomes exactly as presented. Neutral paraphrasing is acceptable only when\
    \ it keeps directionality, agency, sequence, and certainty/modality intact. Flags\
    \ role swaps, causal inversions, unsupported causal claims, and altered outcomes\
    \ as major errors."
  scoring_description: Score how well the response demonstrates causal and relational
    consistency
  definition: "Evaluates whether the summary preserves the article\u2019s cause\u2013\
    effect links, actor\u2013action\u2013recipient roles, temporal order, and stated\
    \ outcomes exactly as presented. Neutral paraphrasing is acceptable only when\
    \ it keeps directionality, agency, sequence, and certainty/modality intact. Flags\
    \ role swaps, causal inversions, unsupported causal claims, and altered outcomes\
    \ as major errors."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Multiple core role swaps or causal inversions (e.g., attributing effects to
      the wrong cause or switching who did what to whom).
    - Invents pivotal relationships or outcomes not in the article, or replaces the
      main causal chain with a contradictory one.
    - Breaks event sequence and agency so that the overall narrative meaning is misleading
      or opposite to the source.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - 'At least one clear major relational error: role swap, causal inversion, or
      misattributed outcome for a key event.'
    - Two or more unsupported causal assertions or sequence changes that materially
      alter interpretation.
    - Misstates a necessary precondition/mechanism such that why/how an outcome occurred
      is incorrectly represented.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - "Overall relationships align, but contains one major relational/causal error\
      \ or 2\u20133 minor misalignments (e.g., ambiguous agency or weakened/strengthened\
      \ causality)."
    - Compresses or reorders non-causal background in a way that could imply an unsupported
      causal link without flipping direction.
    - "Alters strength/modality of causation (e.g., turns \u201Cwas linked to\u201D\
      \ into \u201Ccaused\u201D) while keeping actors and outcome the same."
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - "Core cause\u2013effect links, roles, and outcomes match the article; at most\
      \ one minor imprecision that does not change directionality or responsibility."
    - Temporal order of key events is preserved; no invented causal claims or mechanisms.
    - "Attribution and modality are mostly preserved (e.g., \u201Calleged,\u201D \u201C\
      according to\u201D) with only minor, non-impactful drift."
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - All causal links, roles (who did what to whom), and event sequence exactly match
      the article; zero inversions or swaps.
    - Outcomes and attributions are faithfully preserved with no added or strengthened
      causal claims; modality/uncertainty is intact.
    - Every claimed relationship is traceable to the article with equivalent meaning;
      paraphrases do not alter scope, direction, or timing.
  guidelines:
  - No reversed causality or outcome misreporting (e.g., effect presented as cause).
  - Inter-entity relationships (e.g., affiliations, responsibilities) match the article.
  - Chronological ordering of events is consistent with the source.
  score_range: [0.0, 4.0]
  parent_id: summeval-consistency-judge
  dataset: summeval
  auto_generated: true
  dimension: consistency
- id: summeval-consistency-judge-attribution-and-modality-fidelity
  name: Attribution and Modality Fidelity
  version: '1.0'
  description: "Measures whether the summary correctly attributes statements to the\
    \ appropriate sources and preserves the article\u2019s hedges, uncertainty, and\
    \ reported-speech framing. Evaluates if reported claims remain reported, certainty\
    \ is not overstated or understated, and no new attributions or unwarranted confidence\
    \ are introduced."
  scoring_description: Score how well the response demonstrates attribution and modality
    fidelity
  definition: "Measures whether the summary correctly attributes statements to the\
    \ appropriate sources and preserves the article\u2019s hedges, uncertainty, and\
    \ reported-speech framing. Evaluates if reported claims remain reported, certainty\
    \ is not overstated or understated, and no new attributions or unwarranted confidence\
    \ are introduced."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Multiple core claims are assigned to incorrect sources or to the narrator, including
      reversals of who accused/denied/confirmed.
    - 'Widespread modality distortion: allegations or tentative findings are presented
      as confirmed facts, or denials treated as admissions.'
    - Fabricated or contradictory attributions and confident causal assertions appear
      that are not supported by the article.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - "At least one key statement is misattributed to the wrong party or presented\
      \ as the narrator\u2019s assertion, changing who is making the claim."
    - Important hedges/uncertainty are removed or strengthened (e.g., 'alleged' ->
      'confirmed', 'could' -> 'will'), overstating certainty on salient points.
    - Multiple unsupported attributions or quotes, or systematic conversion of reported
      speech into asserted facts.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Overall attribution aligns, but includes one significant nuance error or two
      minor issues (e.g., conflating two officials into 'authorities', omitting a
      speaker for a secondary claim).
    - Modality is miscalibrated in places (e.g., 'alleged' -> 'likely', 'could' ->
      'probably') affecting emphasis but not reversing the main takeaway.
    - At least one secondary reported claim is rendered as a fact or vague wording
      (e.g., 'they') obscures who said what.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Core attributions match the article; at most one minor compression/generalization
      of a source (e.g., 'police' vs. 'police spokesperson') without changing responsibility
      or authority.
    - Modality and uncertainty are largely preserved; at most one minor hedge dropped/softened
      in a non-salient detail without increasing certainty of key claims.
    - No invented quotations; central allegations are not turned into definitive facts.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - All statements are attributed to the correct sources (or neutrally to the article
      for stated facts) with no invented or shifted speakers.
    - Hedges and uncertainty markers (e.g., alleged, reportedly, according to, estimates)
      are faithfully preserved; no inflation or downgrading of certainty.
    - Reported claims remain reported (direct or indirect speech preserved) and no
      unsupported attributions or quotes are added.
  guidelines:
  - Quotes and claims are attributed to the correct speaker/source (e.g., police,
    officials).
  - Hedging and modality (e.g., alleged, reportedly) are retained and not overstated
    or downplayed.
  - No conversion of reported claims into asserted facts or vice versa.
