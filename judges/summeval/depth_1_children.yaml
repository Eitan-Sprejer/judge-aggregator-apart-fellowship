  name: Outcome or Significance Coverage
  version: '1.0'
  description: "Evaluates whether the summary includes the article\u2019s emphasized\
    \ result, resolution/status update, or stated significance/impact. Judging is\
    \ based on presence and clarity of this aspect as highlighted by the article,\
    \ not on factual correctness or writing quality. Credit paraphrased coverage that\
    \ clearly conveys what happened or why it matters, even if details differ."
  scoring_description: Score how well the response demonstrates outcome or significance
    coverage
  definition: "Evaluates whether the summary includes the article\u2019s emphasized\
    \ result, resolution/status update, or stated significance/impact. Judging is\
    \ based on presence and clarity of this aspect as highlighted by the article,\
    \ not on factual correctness or writing quality. Credit paraphrased coverage that\
    \ clearly conveys what happened or why it matters, even if details differ."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - "Omits any statement of the event\u2019s outcome, resolution/status, or significance/impact."
    - Content is confined to process, background, or unrelated details with no conveyed
      result or importance.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - "Only gestures at consequence or importance (e.g., generic claims like \u201C\
      a significant move\u201D) without specifying a result, resolution, status, or\
      \ stated significance."
    - Emphasis remains on process/background, with at most a vague or tangential hint
      of outcome or impact.
    - "Any implied result is not the article\u2019s emphasized takeaway."
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Mentions a result-like or significance-related idea but it is vague, incomplete,
      or partially misaligned with what the article emphasizes.
    - Misses key qualifiers (e.g., status such as ongoing/settled, scope, or timing)
      that define the outcome/significance.
    - Blurs outcome with process/background, weakening the sense of resolution or
      importance.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Conveys the main outcome/resolution or significance/impact highlighted by the
      article.
    - Omits at most one notable qualifier (e.g., scope, timing, status detail) or
      uses somewhat general wording.
    - Avoids major extraneous focus; the statement clearly indicates what happened
      or why it matters.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - "Explicitly states the article\u2019s emphasized outcome/resolution or stated\
      \ significance/impact, clearly capturing the core result or status."
    - Includes salient qualifier(s) the article highlights (e.g., ongoing vs. resolved
      status, scope/scale, implications or next steps) without adding unrelated consequences.
    - Focus is tightly on the outcome/significance with no substitution by background
      or process details.
  guidelines:
  - States the outcome/result or current status if no final outcome exists.
  - "Conveys the article\u2019s framed significance or implications (why it matters)."
  - Includes any decisions, announcements, or key changes reported.
  score_range: [0.0, 4.0]
  parent_id: summeval-relevance-judge
  dataset: summeval
  auto_generated: true
  dimension: relevance
- id: summeval-relevance-judge-salient-specifics-coverage
  name: Salient Specifics Coverage
  version: '1.0'
  description: "Measures how completely the summary includes the article\u2019s emphasized\
    \ specifics (e.g., concrete time, place, and critical figures) that materially\
    \ define the event. Coverage is counted at the aspect level (e.g., includes a\
    \ date/time, named place, key number) regardless of factual correctness, and non-salient\
    \ or generic details are not rewarded."
  scoring_description: Score how well the response demonstrates salient specifics
    coverage
  definition: "Measures how completely the summary includes the article\u2019s emphasized\
    \ specifics (e.g., concrete time, place, and critical figures) that materially\
    \ define the event. Coverage is counted at the aspect level (e.g., includes a\
    \ date/time, named place, key number) regardless of factual correctness, and non-salient\
    \ or generic details are not rewarded."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - "Covers 0% of the article\u2019s emphasized specifics (none of the identified\
      \ time/place/figures are present)."
    - "Specifics provided are generic or non-salient (e.g., \u201Crecently,\u201D\
      \ \u201Cin the area\u201D) and do not map to the emphasized list."
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - "Covers \u226425% of emphasized specifics (e.g., only one covered when the article\
      \ lists four or more)."
    - Includes at least one non-salient or generic detail that does not correspond
      to the emphasized specifics.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - "Covers about 30\u201360% of emphasized specifics (some key aspects present,\
      \ several missing)."
    - "At most one minor non-salient or generic detail; emphasis partially misaligned\
      \ with the article\u2019s highlighted specifics."
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - "Covers about 60\u201385% of emphasized specifics, including at least two distinct\
      \ aspect types (e.g., time and a key figure)."
    - Contains little extraneous specificity (no more than one minor non-salient detail)
      and few omissions of highlighted specifics.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - "Covers \u226585\u2013100% of emphasized specifics, including all highly emphasized\
      \ time/place/critical figures."
    - No extraneous or generic specifics not on the emphasized list; selection is
      tightly focused on the highlighted specifics.
  guidelines:
  - Includes time or location when these are emphasized by the article.
  - Captures critical numbers, counts, or named items the article stresses.
  - Selects only specifics that are central rather than minor details.
  score_range: [0.0, 4.0]
  parent_id: summeval-relevance-judge
  dataset: summeval
  auto_generated: true
  dimension: relevance
- id: summeval-relevance-judge-focus-alignment
  name: Focus Alignment and Extraneous Avoidance
  version: '1.0'
  description: "Measures how tightly the summary centers on the article\u2019s headline/lead\
    \ and repeatedly emphasized points while avoiding off-topic, speculative, or minor/background\
    \ content. Judge what is selected and prioritized, not factual correctness or\
    \ writing quality. Penalize multiple extraneous additions and misprioritization\
    \ of minor facts over the main event or significance."
  scoring_description: Score how well the response demonstrates focus alignment and
    extraneous avoidance
  definition: "Measures how tightly the summary centers on the article\u2019s headline/lead\
    \ and repeatedly emphasized points while avoiding off-topic, speculative, or minor/background\
    \ content. Judge what is selected and prioritized, not factual correctness or\
    \ writing quality. Penalize multiple extraneous additions and misprioritization\
    \ of minor facts over the main event or significance."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - "Omits or ignores the article\u2019s central focus; content is largely off-topic\
      \ or generic/background filler."
    - Three or more off-topic/peripheral claims overwhelm any central material.
    - Selection centers on unrelated background/speculation rather than the main event
      or emphasized significance.
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Central focus is weak or only vaguely implied; multiple extraneous items are
      present with at least one off-topic or speculative claim.
    - Central facts make up less than ~40% of the content; tangents or background
      dominate or lead.
    - Emphasis misplaces attention on side actors/minor numbers over headline/lead
      priorities.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Mixes central points with peripheral content; includes up to two extraneous
      items or one mildly off-topic aside.
    - "Central facts account for about 40\u201375% of the content; at least one instance\
      \ of misprioritization (e.g., background before the main event)."
    - Includes at least one detail not emphasized by the article or treats a minor
      point as co-equal with central facts.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - Focuses on headline/lead emphasis with at most one minor peripheral detail and
      no off-topic claims.
    - "Central facts constitute roughly \u226575% of the content; main event/significance\
      \ is foregrounded."
    - Any background is brief and clearly supportive of the central points.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - "All selected content aligns with the article\u2019s headline/lead and repeated\
      \ emphasis; no extraneous or off-topic items."
    - "Central facts dominate (\u224890\u2013100% of content) and are prioritized\
      \ in ordering (main event/significance first)."
    - Avoids speculative, tangential, or decorative details not emphasized by the
      article.
  guidelines:
  - Contains no off-topic or speculative claims beyond the article.
  - Avoids minor/background details that displace central points.
  - "Selected facts reflect the article\u2019s emphasis hierarchy (headline/lead and\
    \ repeated points)."
  score_range: [0.0, 4.0]
  parent_id: summeval-relevance-judge
  dataset: summeval
  auto_generated: true
  dimension: relevance
