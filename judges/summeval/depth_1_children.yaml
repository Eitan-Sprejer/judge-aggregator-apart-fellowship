  dimension: consistency
- id: summeval-consistency-judge-unsupported-additions-and-scope-drift
  name: Unsupported Additions and Scope Drift
  version: '1.0'
  description: "Evaluates whether a summary avoids fabricated or untraceable details\
    \ and maintains the original article\u2019s scope. Checks that specific claims\
    \ (entities, numbers, causal links, attributions, outcomes) are directly traceable\
    \ to the source and that any added background is purely generic and does not change\
    \ meaning, emphasis, or scope."
  scoring_description: Score how well the response demonstrates unsupported additions
    and scope drift
  definition: "Evaluates whether a summary avoids fabricated or untraceable details\
    \ and maintains the original article\u2019s scope. Checks that specific claims\
    \ (entities, numbers, causal links, attributions, outcomes) are directly traceable\
    \ to the source and that any added background is purely generic and does not change\
    \ meaning, emphasis, or scope."
  criteria:
  - range: [0.0, 0.9]
    label: Very Poor
    indicators:
    - Introduces multiple central claims or events (key actors, outcomes, numbers,
      quotes) that are not present in the article.
    - "Substantially expands or reframes scope (e.g., local \u2192 national/global;\
      \ single case \u2192 general trend) without support."
    - "Asserts new causal relationships or policy impacts not mentioned, altering\
      \ the article\u2019s core meaning."
  - range: [1.0, 1.9]
    label: Poor
    indicators:
    - Contains at least one major unsupported addition (new main actor/outcome/number)
      or two or more untraceable specifics.
    - Adds scope claims (broader geography, population, timeframe) or trend/generalization
      language not in the article.
    - Introduces non-generic background that injects new facts or emphasis affecting
      interpretation.
  - range: [2.0, 2.9]
    label: Fair
    indicators:
    - Overall grounded but includes one untraceable specific detail (e.g., a number,
      date, or named entity) or a speculative add-on.
    - Mild scope drift via overgeneralization (e.g., turning a single instance into
      a typical pattern) or vague extrapolation.
    - Ambiguous additions whose traceability is unclear yet do not contradict core
      facts or outcomes.
  - range: [3.0, 3.9]
    label: Good
    indicators:
    - All specific claims are traceable; at most one minor, generic background note
      that is neutral and non-inferential.
    - Preserves scope for actors, geography, timeframe, and magnitude; avoids trend/extrapolation
      language beyond the source.
    - No invented numbers, quotes, new events, or causal attributions; hedges/modality
      are retained.
  - range: [4.0, 4.0]
    label: Excellent
    indicators:
    - Every specific claim is exactly or equivalently traceable to the article; zero
      fabricated or unverifiable details.
    - Scope strictly preserved with no expansion of actors, geography, timeframe,
      magnitude, or causality; uncertainty is faithfully maintained.
    - Any added context is minimal and purely generic (e.g., definitions) and does
      not change meaning, emphasis, or scope.
  guidelines:
  - No invented entities, quotes, numbers, or events not present in the article.
  - "No speculative causal or scope claims beyond the article\u2019s evidence."
  - Omissions do not create new implications or broaden/narrow scope inaccurately.
  score_range: [0.0, 4.0]
  parent_id: summeval-consistency-judge
  dataset: summeval
  auto_generated: true
  dimension: consistency
- id: summeval-fluency-judge-sentence-structure-and-boundaries
  name: Sentence Structure and Boundaries
