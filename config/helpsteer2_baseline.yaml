# HelpSteer2 Baseline Experiment Configuration
# Full baseline with automatic judge creation and dataset-specific judges
#
# This configuration demonstrates the judge creation and selection pipeline.
# It will:
# 1. Auto-create parent judges for each HelpSteer2 dimension
# 2. Decompose parent judges into specialized children
# 3. Train 5 separate aggregators (one per dimension)
# 4. Compare against baseline methods
#
# Usage:
#   python run_experiment.py config/helpsteer2_baseline.yaml

name: "helpsteer2-baseline"
dataset: "helpsteer2"
target: "target_human_aggregated"
target_dimension: "helpfulness"           # Train on helpfulness dimension

# Dataset configuration
dataset_kwargs:
  n_samples: 500                          # Use 500 samples for baseline
  random_seed: 42
  split: "train"

# Judge configuration
judges:
  # Auto-create judges for target_dimension (helpfulness)
  create:
    depth: 1                              # 1 level of decomposition (parent → ~4-5 children)
    cache: "auto"                         # Load from cache if exists, create if missing
    model: "openai/gpt-5"                 # Model for judge creation
    temperature: 0.4
    max_tokens: 10000

  # Judge evaluation model (used for scoring responses AND baselines)
  judge_model: "openai/gpt-5-mini"

  # Score range
  score_range: [0.0, 4.0]

# Model training configuration
models:
  train_gam: true
  train_mlp: true
  test_size: 0.2                          # 100 samples for test (20%)
  val_size: 0.15                          # 75 samples for validation (15%)

  gam:
    n_splines: 10
    lam: 0.6
    max_iter: 200

  mlp:
    hidden_dim: 64
    learning_rate: 0.001
    batch_size: 32
    n_epochs: 100
    dropout: 0.1
    l2_reg: 0.001
    early_stopping_patience: 15
    min_delta: 0.0001

# Concurrency
concurrency: 5                            # Parallel judge API calls

# Random seed
random_seed: 42
