# HelpSteer2 Baseline - All 5 Dimensions (100 samples)
# Single config for all dimensions
#
# Total expected cost: ~$0.95 (5 dimensions × ~$0.19 each)
# Each dimension creates its own 6 judges (1 parent + 5 children)

name: "helpsteer2-baseline"
dataset: "helpsteer2"
target: "target_human_aggregated"

# List of dimensions to train on (will create separate models for each)
target_dimensions: ["helpfulness", "correctness", "coherence", "complexity", "verbosity"]

# Dataset configuration
dataset_kwargs:
  n_samples: 1000                    # 1000 samples for testing
  random_seed: 42
  split: "train"

# Judge configuration
judges:
  create:
    depth: 1                        # Creates ~6 judges per dimension
    cache: "auto"                   # Reuse judge definitions, but scores will be fresh
    model: "openai/gpt-5"
    temperature: 0.4
    max_tokens: 10000

  judge_model: "openai/gpt-5-mini"  # Model for scoring ($0.250/1M input, $2.000/1M output)
  score_range: [0.0, 4.0]

# Model training
models:
  train_gam: true
  train_mlp: false                  # Disable MLP for faster testing
  test_size: 0.2                    # 20 samples for test
  val_size: 0.15                    # 15 samples for validation

  # Hyperparameter tuning
  tuning:
    enabled: true                   # Find optimal GAM params

  # Default GAM hyperparameters
  gam:
    n_splines: 10
    lam: 0.6
    max_iter: 200

concurrency: 10                     # Parallel judge API calls
random_seed: 42

# This will:
# 1. Create judges for all 5 dimensions (30 judges total, cached after first creation)
# 2. Evaluate 100 samples with all judges (~3000 API calls total, but only ~600 per dimension due to caching)
# 3. Train 5 separate GAM models (one per dimension)
# 4. Generate visualizations for each dimension
# 5. Save results in separate directories per dimension
#
# Total cost: ~$0.19 × 5 = ~$0.95
