# Test Experiment Configuration - HelpSteer2 (n=50)
# Quick test with real human annotations, no persona simulation
#
# Available Datasets and Dimensions:
#   - ultrafeedback: ['overall'] (synthetic only, no human annotations)
#   - helpsteer2: ['helpfulness', 'correctness', 'coherence', 'complexity', 'verbosity']
#   - summeval: ['coherence', 'consistency', 'fluency', 'relevance']
#   - newsroom: ['Informativeness', 'Relevance', 'Fluency', 'Coherence']
#   - recipe: ['grammar', 'fluency', 'verbosity', 'structure', 'success', 'overall']
#   - wmt_en_de, wmt_zh_en: ['quality']

name: "test-helpsteer2-50"
dataset: "helpsteer2"
target: "target_human_aggregated"  # Use real human annotations (no persona simulation)
target_dimension: "helpfulness"  # REQUIRED: Specific dimension to predict

dataset_kwargs:
  n_samples: 50
  random_seed: 42
  split: "train"  # or "validation"

judges:
  judge_ids:
    - "truthfulness-judge"
    - "harmlessness-judge"
    - "helpfulness-judge"
    - "honesty-judge"
    - "explanatory-depth-judge"
    - "instruction-following-judge"
    - "clarity-judge"
    - "conciseness-judge"
    - "logical-consistency-judge"
    - "creativity-judge"

  judge_names:
    - "Truthfulness"
    - "Harmlessness"
    - "Helpfulness"
    - "Honesty"
    - "Explanatory Depth"
    - "Instruction Following"
    - "Clarity"
    - "Conciseness"
    - "Logical Consistency"
    - "Creativity"

  score_range: [0.0, 4.0]

models:
  train_gam: true
  train_mlp: true
  test_size: 0.2    # 10 samples for test
  val_size: 0.15    # ~6 samples for validation

  gam:
    n_splines: 5    # Reduced for small dataset
    lam: 0.6
    max_iter: 50    # Faster for testing

  mlp:
    hidden_dim: 32  # Smaller for small dataset
    learning_rate: 0.005
    batch_size: 8   # Smaller batches
    n_epochs: 50    # Fewer epochs
    dropout: 0.0
    l2_reg: 0.0
    early_stopping_patience: 10
    min_delta: 0.0001

concurrency: 3  # Moderate parallelism for judge API calls

random_seed: 42
