# Minimal Test Configuration for Judge Creation Pipeline
# Tests the new simplified config structure

name: "test-judge-creation-minimal"
dataset: "helpsteer2"
target: "target_human_aggregated"
target_dimension: "helpfulness"

# Minimal dataset for fast testing
dataset_kwargs:
  n_samples: 10
  random_seed: 42
  split: "train"

# NEW SIMPLIFIED STRUCTURE
judges:
  create:
    depth: 1
    cache: "auto"
    model: "openai/gpt-5"
    temperature: 0.4

  # Judge evaluation model
  judge_model: "openai/gpt-5-mini"

  # Score range
  score_range: [0.0, 4.0]

# Minimal model training (GAM only for speed)
models:
  train_gam: true
  train_mlp: false
  test_size: 0.2
  val_size: 0.15

  gam:
    n_splines: 5
    lam: 0.6
    max_iter: 50

concurrency: 3
random_seed: 42
