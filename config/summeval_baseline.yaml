# SummEval Baseline - All 4 Dimensions (1000 samples)
# Uses expert annotations only (3 experts, not 5 crowdworkers)
#
# Dataset: SummEval from JUDGE-BENCH
# Task: Summarization quality evaluation
# Dimensions: coherence, consistency, fluency, relevance (1-5 scale)

name: "summeval-baseline"
dataset: "judge_bench"
target: "target_human_aggregated"

# List of dimensions to train on
target_dimensions: ["coherence", "consistency", "fluency", "relevance"]

# Dataset configuration
dataset_kwargs:
  task_name: "summeval"
  n_samples: 1000
  random_seed: 42
  use_experts_only: true              # Only use 3 expert annotations, not crowdworkers

# Judge configuration
judges:
  create:
    depth: 1                          # Creates ~6 judges per dimension
    cache: "auto"
    model: "openai/gpt-5"
    temperature: 0.4
    max_tokens: 10000

  judge_model: "openai/gpt-5-nano"
  score_range: [1.0, 5.0]             # SummEval uses 1-5 scale

# Model training
models:
  train_gam: true
  train_mlp: false
  test_size: 0.2
  val_size: 0.15

  tuning:
    enabled: true

  gam:
    n_splines: 10
    lam: 0.6
    max_iter: 200

concurrency: 10
random_seed: 42
