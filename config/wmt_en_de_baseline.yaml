# WMT en→de Baseline - Translation Quality (1000 samples)
# Uses expert annotations (3 expert translators per instance)
#
# Dataset: WMT-20 from JUDGE-BENCH
# Task: Machine translation quality evaluation (English → German)
# Dimensions: quality (0-6 scale)

name: "wmt-en-de-baseline"
dataset: "wmt_en_de"
target: "target_human_aggregated"

# Single dimension for translation quality
target_dimensions: ["quality"]

# Dataset configuration
dataset_kwargs:
  task_name: "wmt_en_de"
  n_samples: 1000
  random_seed: 42

# Judge configuration
judges:
  create:
    depth: 1                          # Creates ~6 judges for quality dimension
    cache: "auto"
    model: "openai/gpt-5"
    temperature: 0.4
    max_tokens: 10000

  judge_model: "openai/gpt-5-nano"
  score_range: [0.0, 6.0]             # WMT uses 0-6 scale

# Model training
models:
  train_gam: true
  train_mlp: false
  test_size: 0.2
  val_size: 0.15

  tuning:
    enabled: true

  gam:
    n_splines: 10
    lam: 0.6
    max_iter: 200

concurrency: 10
random_seed: 42
