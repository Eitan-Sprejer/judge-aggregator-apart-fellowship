# UltraFeedback with Persona Simulation Configuration
# This configuration demonstrates automatic persona simulation when
# target='target_synthetic'. The experiment runner will detect that
# synthetic annotations are needed and automatically run persona simulation.
#
# Usage:
#   python run_experiment.py config/persona_synthetic_ultrafeedback.yaml

name: "persona-synthetic-ultrafeedback"
dataset: "ultrafeedback"                  # Dataset name for loader
target: "target_synthetic"                # AUTO-TRIGGERS persona simulation
target_dimensions: ["overall"]               # UltraFeedback only has ['overall'] dimension

# Dataset parameters
dataset_kwargs:
  n_samples: 100                          # Small sample for testing (64K total available)
  random_seed: 42

# Judge configuration
judges:
  # Use existing 10 baseline judges from UltraFeedback
  use_files: ["judges/ultrafeedback/depth_0_parents.yaml"]

  # Judge evaluation model
  judge_model: "openai/gpt-5-nano"

  # Score range
  score_range: [0.0, 4.0]

# Model training configuration
models:
  train_gam: true
  train_mlp: false                        # Only GAM for faster training
  test_size: 0.2
  val_size: 0.15

  # Hyperparameter tuning
  tuning:
    enabled: true                         # Find optimal GAM params

  gam:
    n_splines: 10
    lam: 0.6
    max_iter: 100

  mlp:
    hidden_dim: 64
    learning_rate: 0.005
    batch_size: 16
    n_epochs: 100
    dropout: 0.0
    l2_reg: 0.0
    early_stopping_patience: 15
    min_delta: 0.0001

# API concurrency settings
concurrency: 1                            # Max concurrent API calls for persona simulation and judge evaluation

# Random seed
random_seed: 42
