# Dataset-Specific Human Annotation Rubrics
#
# These rubrics mirror the exact instructions given to human annotators for each dataset.
# The LLM judge receives the same rubric and is expected to return scores in JSON format.
#
# Structure for each dataset:
#   rubric: Multi-line text with full annotation instructions (given to humans)
#   dimensions: List of evaluation dimensions with their scales
#   response_format: "json" (forced via OpenAI API response_format parameter)
#
# Note: Model and temperature are NOT specified here - they come from experiment config

helpsteer2:
  # EXACT annotation guidelines from HelpSteer paper (Appendix A.1)
  # These are the verbatim instructions given to human annotators
  rubric: |
    You are evaluating the quality of an AI assistant's response to a user prompt/instruction.
    Your task is to rate the response based on 5 axes, each on a 5-point Likert scale (0-4).

    ## Dimensions to Evaluate

    ### 1. Helpfulness (0-4)
    How useful and helpful the overall response is.

    - 0: The response is not useful or helpful at all. The response completely missed the essence of what the user wanted.
    - 1: The response is borderline unhelpful and mostly does not capture what the user was looking for, but is still usable and helpful in a small way.
    - 2: The response is partially helpful but misses the overall goal of the user's query/input in some way. The response did not fully satisfy what the user was looking for.
    - 3: The response is mostly helpful and mainly aligned with what the user was looking for, but there is still some room for improvement.
    - 4: The response is extremely helpful and completely aligned with the spirit of what the prompt was asking for.

    ### 2. Correctness (0-4)
    The response is based on facts, no hallucinations, no mistakes. The response covers everything required in the instruction.

    - 0: The response is completely incorrect. All information provided is wrong, false or hallucinated. If the prompt asks the assistant to do a task, the task is not at all attempted, or the wrong task was attempted in the response. The response is completely irrelevant to the prompt.
    - 1: The response has some correct elements but is mostly wrong or incomplete. The response may contain multiple instances of hallucinations, false information, misleading information, or irrelevant information. If the prompt asks the assistant to do a task, the task was attempted with a small amount of success.
    - 2: The response contains a mix of correct and incorrect information. The response may miss some details, contain misleading information, or minor hallucinations, but is more or less aligned with what the prompt asks for. If the prompt asks the assistant to perform a task, the task is attempted with moderate success but still has clear room for improvement.
    - 3: The response is mostly accurate and correct with a small amount of missing information. It contains no misleading information or hallucinations. If the prompt asks the assistant to perform a task, the task is mostly successfully attempted.
    - 4: The response is completely correct and accurate to what is requested by the prompt with no necessary details missing and without false, misleading, or hallucinated information. If the prompt asks the assistant to do a task, the task is completely done and addressed in the response.

    ### 3. Coherence (0-4)
    The response is self-consistent in terms of content, style of writing, and does not contradict itself. The response can be logically followed and understood by a human. The response does not contain redundant or repeated information.

    - 0 (Completely Incoherent and/or Unclear): The response is completely incomprehensible and no clear meaning or sensible message can be discerned from it.
    - 1 (Mostly Incoherent and/or Unclear): The response is mostly hard to follow, with inconsistencies, contradictions, confusing logic flow, or unclear language used throughout, but there are some coherent/clear parts.
    - 2 (A Little Unclear and/or Incoherent): The response is a little unclear. There are some inconsistencies or contradictions, run on sentences, confusing statements, or hard to follow sections of the response.
    - 3 (Mostly Coherent and Clear): The response is mostly clear and coherent, but there may be one or two places where the wording is confusing or the flow of the response is a little hard to follow. Overall, the response can mostly be followed with a little room for improvement.
    - 4 (Perfectly Coherent and Clear): The response is perfectly clear and self-consistent throughout. There are no contradictory assertions or statements, the writing flows logically, and following the train of thought/story is not challenging.

    ### 4. Complexity (0-4)
    Rate the response along a simple to complex spectrum. A simple response uses simple, easy to understand vocabulary and sentence structure that children can understand. Conversely, a complex response uses sophisticated language with enhanced vocabulary that adults with advanced education or experts on the topic would use.

    - 0 (Basic): The response uses very easy to understand language that is clear and completely interpretable by children, adults, and anyone with a functional command of the language.
    - 1 (Simple): The response uses relatively straightforward language and wording, but some schooling through elementary or a middle school in the language might be required to understand the response.
    - 2 (Intermediate): People who have completed up through a high school education will probably be able to understand the vocabulary and sentence structure used, but those at the basic level or children might struggle to understand the response.
    - 3 (Advanced): The response uses a fairly sophisticated vocabulary and terminology. Someone majoring in this subject at a college or university could have written it and would understand the response. An average adult who does not work or study in this area could not have written the response.
    - 4 (Expert): An expert in the field or area could have written the response. It uses specific and technically relevant vocabulary. It contains elevated language that someone at the simple or basic level may not understand at all. The professional language of a lawyer, scientist, engineer, or doctor falls into this category.

    ### 5. Verbosity (0-4)
    Place the response on a spectrum from the most short, crisp answers, to the most lengthy, detailed, and/or wordy answers under the context of what a user is expecting as a response to the prompt.

    - 0 (Succinct): The response is short, to the point, and the most concise it can be. No additional information is provided outside of what is requested by the prompt.
    - 1 (Pretty Short): The response is on the shorter side but could still have words, details, and/or text removed before it's at a bare minimum of what the response is trying to convey.
    - 2 (Average Length): The response isn't especially long or short given what the prompt is asking of the model. The length is adequate for conveying a full response but isn't particularly wordy nor particularly concise.
    - 3 (Moderately Long): The response is on the longer side but could still have more added to it before it is considered fully detailed or rambling.
    - 4 (Verbose): The response is particularly lengthy, wordy, and/or extensive with extra details given what the prompt requested from the assistant model. The response can be verbose regardless of if the length is due to repetition and incoherency or if it is due to rich and insightful detail.

    ## Instructions
    - Read the prompt and response carefully
    - Consider each dimension independently
    - For each dimension, provide a brief explanation (1-2 sentences) and then a score (0-4)
    - Return in JSON format: {"helpfulness": {"explanation": "...", "score": X}, "correctness": {"explanation": "...", "score": X}, "coherence": {"explanation": "...", "score": X}, "complexity": {"explanation": "...", "score": X}, "verbosity": {"explanation": "...", "score": X}}

  dimensions:
    - name: "helpfulness"
      scale: [0, 4]
      description: "How useful and helpful the overall response is"
    - name: "correctness"
      scale: [0, 4]
      description: "Factual accuracy - no hallucinations, no mistakes, covers requirements"
    - name: "coherence"
      scale: [0, 4]
      description: "Self-consistency, logical flow, clarity, no contradictions or redundancy"
    - name: "complexity"
      scale: [0, 4]
      description: "Language sophistication level: Basic(0) children understand → Expert(4) professional terminology"
    - name: "verbosity"
      scale: [0, 4]
      description: "Response length spectrum: Succinct(0) short/concise → Verbose(4) lengthy/detailed"

  response_format: "json"

summeval:
  # EXACT annotation guidelines from SummEval (Fabbri et al., 2021)
  # These are the verbatim instructions given to human annotators
  rubric: |
    In this task you will evaluate the quality of a summary written for a news article.
    Rate the summary on a scale from 1 (worst) to 5 (best) by its relevance, consistency, fluency, and coherence.

    ## Definitions

    **Relevance:**
    The rating measures how well the summary captures the key points of the article.
    Consider whether all and only the important aspects are contained in the summary.

    **Consistency:**
    The rating measures whether the facts in the summary are consistent with the facts in the original article.
    Consider whether the summary does reproduce all facts accurately and does not make up untrue information.

    **Fluency:**
    This rating measures the quality of individual sentences, are they well-written and grammatically correct.
    Consider the quality of individual sentences.

    **Coherence:**
    The rating measures the quality of all sentences collectively, to the fit together and sound naturally.
    Consider the quality of the summary as a whole.

    ## Instructions
    - Carefully read the news article, be aware of the information it contains
    - Read the proposed summary
    - Rate the summary on a scale from 1 (worst) to 5 (best) by its relevance, consistency, fluency, and coherence
    - For each dimension, provide a brief explanation (1-2 sentences) and then a score (1-5)
    - Return in JSON format: {"relevance": {"explanation": "...", "score": X}, "consistency": {"explanation": "...", "score": X}, "fluency": {"explanation": "...", "score": X}, "coherence": {"explanation": "...", "score": X}}

  dimensions:
    - name: "relevance"
      scale: [1, 5]
      description: "How well the summary captures the key points of the article"
    - name: "consistency"
      scale: [1, 5]
      description: "Factual consistency with the original article"
    - name: "fluency"
      scale: [1, 5]
      description: "Quality of individual sentences - well-written and grammatically correct"
    - name: "coherence"
      scale: [1, 5]
      description: "Quality of all sentences collectively - fit together and sound natural"

  response_format: "json"

wmt_en_de:
  # Annotation guidelines for WMT-20 English→German translation quality
  # Based on Scalar Quality Metric (SQM) from Freitag et al., TACL 2021
  # Professional translators (native German speakers) rated translations
  rubric: |
    You are evaluating translation quality. Given a source text (English) and its translation (German), rate the translation on a scale from 0 to 6 based on how well it preserves the meaning of the source and how natural it reads in the target language.

    ## Quality Scale (0-6)

    **0 - Nonsense**: The translation is completely unrelated to the source, incomprehensible, or no meaning is preserved whatsoever.

    **1 - Very low quality**: Only fragments of meaning are preserved. The translation is largely incomprehensible or misleading.

    **2 - Low quality**: Some meaning is preserved, but the translation is difficult to understand due to major accuracy or fluency errors.

    **3 - Medium quality**: The core meaning is preserved and the translation is understandable, but there are significant errors in accuracy, fluency, or both.

    **4 - Good quality**: Most of the meaning is preserved accurately. There are some minor errors in accuracy or fluency, but they do not significantly impede understanding.

    **5 - Very good quality**: The meaning is fully preserved with only minor fluency issues (e.g., slightly unnatural phrasing, minor stylistic issues). No accuracy errors.

    **6 - Perfect**: The translation accurately conveys all meaning from the source with natural, fluent target language. No errors.

    ## Instructions
    - Read the source text (English)
    - Read the translation (German)
    - Rate overall translation quality on a 0-6 scale considering both meaning preservation and fluency
    - Provide a brief explanation (1-2 sentences) and then a score (0-6)
    - Return in JSON format: {"quality": {"explanation": "...", "score": X}}

  dimensions:
    - name: "quality"
      scale: [0, 6]
      description: "Overall translation quality - meaning preservation and target language fluency"

  response_format: "json"

ultrafeedback:
  rubric: |
    You are evaluating the overall quality of an AI assistant's response.
    Rate the response on a scale from 1 to 5 based on overall quality.

    **Overall Quality (1-5):**
    - 1: Very poor response, unhelpful and problematic
    - 2: Poor response with significant issues
    - 3: Acceptable response, meets basic requirements
    - 4: Good response, helpful and well-constructed
    - 5: Excellent response, exceptionally helpful and high-quality

    **Consider these aspects in your overall rating:**
    - Helpfulness and relevance
    - Accuracy of information
    - Clarity and coherence
    - Appropriate level of detail
    - Overall usefulness to the user

    **Instructions:**
    - Read the question and response carefully
    - Provide a brief explanation (1-2 sentences) and then assign an overall quality score from 1-5
    - Return in JSON format: {"overall": {"explanation": "...", "score": X}}

  dimensions:
    - name: "overall"
      scale: [1, 5]
      description: "Overall quality of the response"

  response_format: "json"

