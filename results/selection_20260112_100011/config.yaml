data_file: datasets/data_with_judge_scores.pkl
description: Prune to half the UltraFeedback judges on workshop data
gam_lam: 0.6
gam_n_splines: 10
initial_judge_file: judges/ultrafeedback/depth_0_parents.yaml
llm_model: openai/gpt-5-nano
max_correlation: 0.9
max_iterations: 10
max_judges: 15
min_judges: 3
name: iterative-selection-ultrafeedback-prune-half
output_dir: results/selection_20260112_100011
plateau_patience: 10
proposal_mode: decompose
protected_judges:
- truthfulness-judge
- harmlessness-judge
- helpfulness-judge
r2_degradation_threshold: null
r2_improvement_threshold: 0.0
save_intermediate: true
selection_mode: backward
target_column: target
target_judges: 5
train_test_split: 0.3
use_llm_suggestions: false
validation_split: 0.15
